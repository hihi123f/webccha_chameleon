<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>웹챠 카멜레온 V7.3 - 무손실 고화질 캡처</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: white; overflow: hidden; display: flex; flex-direction: column; touch-action: none; user-select: none; }
    
    /* 상단 UI */
    #ui { padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; background: #222; border-bottom: 3px solid #444; z-index: 10; min-height: 45px; }
    button, input[type="color"] { padding: 6px 12px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; font-size: 14px; transition: 0.1s; }
    button:active { transform: translateY(2px); }
    
    #ui-move, #ui-edit, #ui-seek, #ui-gameover { display: flex; gap: 10px; align-items: center; }
    #ui-edit, #ui-seek, #ui-gameover { display: none; }

    #btn-copy { background: #3498db; color: white; }
    #btn-hide { background: #e74c3c; color: white; }
    #btn-restart { background: #2ecc71; color: white; }
    .active-tool { border: 2px solid #ffd32a !important; background: #555; color: #ffd32a; }

    /* 슬라이더 컨트롤 박스 */
    .control-box { display: flex; align-items: center; gap: 5px; background: #444; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; }
    .control-box input[type="range"] { width: 80px; }

    /* 맵 컨테이너 */
    #map-container { position: relative; width: 100vw; height: calc(100vh - 65px); overflow: hidden; background: #fff; }
    /* 원본 화질 유지를 위해 image-rendering 속성 제거 */
    #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* 플레이어 & 뷰파인더 */
    #player {
      position: absolute; width: 80px; height: 80px;
      transform: translate(-50%, -50%); z-index: 5;
      border: 2px dashed #e74c3c; background: rgba(231, 76, 60, 0.1);
      box-sizing: border-box; touch-action: none;
    }
    
    /* 크기 조절 핸들 */
    #resize-handle {
      position: absolute; right: -5px; bottom: -5px; width: 20px; height: 20px;
      background: #f1c40f; border: 2px solid #333; border-radius: 50%; cursor: se-resize; z-index: 10;
    }

    #doodle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; cursor: crosshair; }

    /* 복사 완료 상태 (배경 이미지 고화질 세팅) */
    .copied { border: none !important; background-color: transparent !important; background-size: 100% 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .copied #resize-handle { display: none; }
    
    .walking { animation: waddle 0.25s infinite alternate; }
    @keyframes waddle { 0% { margin-left: -2px; } 100% { margin-left: 2px; } }

    /* 숨기 모드 */
    .breathing { box-shadow: none !important; animation: breath 4s infinite ease-in-out; pointer-events: auto !important; cursor: pointer; }
    @keyframes breath { 
      0%, 100% { filter: brightness(1); transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); } 
      50% { filter: brightness(1.02); transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.02); } 
    }

    /* 본체 등장 & 이펙트 */
    #jelly-busted { position: absolute; display: none; font-size: 50px; z-index: 7; transform: translate(-50%, -50%); animation: popOut 0.3s forwards, tremble 0.1s infinite 0.3s; pointer-events: none; }
    @keyframes popOut { 0% { transform: translate(-50%, -50%) scale(0); } 100% { transform: translate(-50%, -50%) scale(1); } }
    @keyframes tremble { 0%, 100% { margin-left: -3px; } 50% { margin-left: 3px; } }

    .shake-screen { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, -4px, 0); } }
    .floating-text { position: absolute; font-weight: 900; font-size: 26px; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: floatUp 1.5s ease-out forwards; z-index: 100; color: white; white-space: nowrap; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }

    /* 조이스틱 */
    #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px; background: rgba(0,0,0,0.15); border-radius: 50%; z-index: 20; display: none; }
    #joystick-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: rgba(255,255,255,0.6); border-radius: 50%; }
  </style>
</head>
<body>

  <div id="ui">
    <div id="ui-move">
      <span style="font-size:13px; color:#aaa;">노란 점으로 크기 조절</span>
      <button id="btn-copy" onclick="copyBackground()">📸 스캔 (Space)</button>
    </div>
    
    <div id="ui-edit">
      <div class="control-box">
        🔄 <input type="range" id="rot-slider" min="0" max="360" value="0">
      </div>
      <input type="color" id="doodle-color" value="#000000">
      <button id="btn-pen" class="active-tool" onclick="setTool('pen')">🖌️</button>
      <button id="btn-eraser" onclick="setTool('eraser')">🧹</button>
      <button id="btn-hide" onclick="startHiding()">🤫 완벽 주차!</button>
    </div>

    <div id="ui-seek">
      <span style="color:#e74c3c; font-size:18px; font-weight:bold;">❤️ <span id="life">3</span></span> | 
      <span style="color:#f1c40f; font-size:18px; font-weight:bold;">⏱️ <span id="time">0.00</span>초</span>
    </div>
    <div id="ui-gameover">
      <button id="btn-restart" onclick="initGame()">🔄 다음 맵으로!</button>
    </div>
  </div>

  <div id="map-container">
    <canvas id="bg-canvas"></canvas>
    
    <div id="player">
      <canvas id="doodle-canvas"></canvas>
      <div id="resize-handle"></div>
    </div>
    
    <div id="jelly-busted">😳💦</div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
  </div>

  <script>
    const mapContainer = document.getElementById('map-container');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const player = document.getElementById('player');
    const resizeHandle = document.getElementById('resize-handle');
    const doodleCanvas = document.getElementById('doodle-canvas');
    const doodleCtx = doodleCanvas.getContext('2d');
    const rotSlider = document.getElementById('rot-slider');
    
    let mode = 'move';
    let pX, pY, pWidth = 80, pHeight = 80;
    let vX = 0, vY = 0;
    let rotation = 0;
    const speed = 4;
    let keys = {};
    let life = 3, startTime, timerInterval;
    let currentMapIndex = 0;
    
    // 기기 해상도(DPR) 가져오기
    const dpr = window.devicePixelRatio || 1; 

    const isMobile = 'ontouchstart' in window;
    if (isMobile) {
      document.getElementById('joystick-zone').style.display = 'block';
      document.getElementById('btn-copy').innerText = '📸 캡처';
    }

    // --- 1. 맵 7종 생성 (해상도 텍스트 렌더링 최적화) ---
    const mapGenerators = [
      function drawYoutube() {
        bgCtx.fillStyle = '#0f0f0f'; bgCtx.fillRect(0, 0, bgCanvas.width/dpr, bgCanvas.height/dpr);
        for(let i=0; i<6; i++) {
          let x = (i%2)*(bgCanvas.width/dpr/2) + 10, y = Math.floor(i/2)*220 + 20;
          bgCtx.fillStyle = '#333'; bgCtx.fillRect(x, y, (bgCanvas.width/dpr/2)-20, 140);
          bgCtx.fillStyle = 'rgba(0,0,0,0.8)'; bgCtx.fillRect(x+ (bgCanvas.width/dpr/2)-70, y+110, 45, 20);
          bgCtx.fillStyle = '#fff'; bgCtx.font = '12px sans-serif'; bgCtx.fillText('10:24', x+ (bgCanvas.width/dpr/2)-65, y+125);
          bgCtx.beginPath(); bgCtx.arc(x+25, y+170, 15, 0, Math.PI*2); bgCtx.fillStyle='#aaa'; bgCtx.fill();
          bgCtx.fillStyle = '#fff'; bgCtx.font = 'bold 14px sans-serif'; bgCtx.fillText('웹챠 카멜레온 레전드 플레이', x+50, y+165);
        }
      },
      function drawInsta() {
        bgCtx.fillStyle = '#fff'; bgCtx.fillRect(0, 0, bgCanvas.width/dpr, bgCanvas.height/dpr);
        let cx = bgCanvas.width/dpr/2 - 150;
        bgCtx.beginPath(); bgCtx.arc(cx+30, 40, 20, 0, Math.PI*2); bgCtx.fillStyle='#ff7675'; bgCtx.fill();
        bgCtx.fillStyle = '#2d3436'; bgCtx.font = 'bold 14px sans-serif'; bgCtx.fillText('jelly_official', cx+60, 45);
        bgCtx.fillStyle = '#dfe6e9'; bgCtx.fillRect(cx, 70, 300, 300);
        bgCtx.fillStyle = '#ff4757'; bgCtx.font = '24px sans-serif'; bgCtx.fillText('❤️ 💬 ↗️', cx+10, 400);
        bgCtx.fillStyle = '#2d3436'; bgCtx.font = '14px sans-serif'; bgCtx.fillText('좋아요 14,230개', cx+10, 425);
      },
      function drawDashboard() {
        bgCtx.fillStyle = '#1e272e'; bgCtx.fillRect(0, 0, bgCanvas.width/dpr, bgCanvas.height/dpr);
        let cx = 120, cy = 120;
        bgCtx.beginPath(); bgCtx.moveTo(cx, cy); bgCtx.arc(cx, cy, 80, 0, Math.PI*1.2); bgCtx.fillStyle = '#0fb9b1'; bgCtx.fill();
        bgCtx.beginPath(); bgCtx.moveTo(cx, cy); bgCtx.arc(cx, cy, 80, Math.PI*1.2, Math.PI*2); bgCtx.fillStyle = '#fed330'; bgCtx.fill();
        for(let i=0; i<8; i++) {
          bgCtx.fillStyle = ['#fc5c65','#fd9644','#fed330','#26de81'][i%4];
          bgCtx.fillRect(250 + i*40, 220 - Math.random()*150, 25, 200);
        }
      },
      function drawChat() {
        bgCtx.fillStyle = '#b2c7d9'; bgCtx.fillRect(0, 0, bgCanvas.width/dpr, bgCanvas.height/dpr);
        for(let i=0; i<6; i++) {
          let y = 50 + i*70;
          if (i%2===0) { bgCtx.fillStyle = '#fff'; bgCtx.fillRect(20, y, 180, 40); bgCtx.fillStyle = '#333'; bgCtx.font = '14px sans-serif'; bgCtx.fillText('오늘 점심 뭐먹지?', 30, y+25); } 
          else { bgCtx.fillStyle = '#ffeb33'; bgCtx.fillRect(bgCanvas.width/dpr - 200, y, 180, 40); bgCtx.fillStyle = '#333'; bgCtx.fillText('치킨 어떰 ㅋㅋ', bgCanvas.width/dpr - 190, y+25); }
        }
      },
      function drawNews() {
        bgCtx.fillStyle = '#fff'; bgCtx.fillRect(0, 0, bgCanvas.width/dpr, bgCanvas.height/dpr);
        bgCtx.fillStyle = '#333'; bgCtx.font = 'bold 24px sans-serif'; bgCtx.fillText('IT 속보: 젤리 탈출 사건', 20, 50);
        bgCtx.fillStyle = '#666'; bgCtx.font = '14px sans-serif';
        for(let i=0; i<10; i++) bgCtx.fillText('엄청난 퀄리티의 위장술로 모두를 속인 젤리가 화제입니다...', 20, 100 + i*30);
      },
      function drawShop() {
        bgCtx.fillStyle = '#f8f9fa'; bgCtx.fillRect(0, 0, bgCanvas.width/dpr, bgCanvas.height/dpr);
        for(let i=0; i<6; i++) {
          let x = (i%3)*130 + 20, y = Math.floor(i/3)*180 + 50;
          bgCtx.fillStyle = '#dfe4ea'; bgCtx.fillRect(x, y, 110, 110);
          bgCtx.fillStyle = '#ff4757'; bgCtx.fillRect(x, y+120, 110, 30);
          bgCtx.fillStyle = '#fff'; bgCtx.font = 'bold 13px sans-serif'; bgCtx.fillText('구매하기', x+28, y+140);
        }
      },
      function drawCode() {
        bgCtx.fillStyle = '#282c34'; bgCtx.fillRect(0, 0, bgCanvas.width/dpr, bgCanvas.height/dpr);
        bgCtx.font = '15px monospace';
        const codeLines = ['function hack() {', '  return "You cant find me";', '}', 'console.log(hack());'];
        for(let i=0; i<15; i++) {
          bgCtx.fillStyle = ['#e06c75', '#98c379', '#e5c07b', '#56b6c2'][i%4];
          bgCtx.fillText(codeLines[i%4], 40, 50 + i*25);
        }
      }
    ];

    function renderMap() {
      bgCanvas.width = mapContainer.clientWidth * dpr; 
      bgCanvas.height = mapContainer.clientHeight * dpr;
      bgCtx.scale(dpr, dpr); 
      mapGenerators[currentMapIndex % mapGenerators.length]();
    }
    window.addEventListener('resize', renderMap);

    // --- 2. 초기화 ---
    window.initGame = () => {
      mode = 'move'; life = 3; rotation = 0; rotSlider.value = 0;
      pWidth = 80; pHeight = 80;
      
      // 좌표를 무조건 정수로 떨어지게 초기화 (소수점 블러 방지)
      pX = Math.round(mapContainer.clientWidth / 2); 
      pY = Math.round(mapContainer.clientHeight / 2);
      
      document.getElementById('ui-move').style.display = 'flex';
      document.getElementById('ui-edit').style.display = 'none';
      document.getElementById('ui-seek').style.display = 'none';
      document.getElementById('ui-gameover').style.display = 'none';
      
      player.style.display = 'flex'; player.className = '';
      player.style.backgroundImage = 'none'; 
      player.style.width = `${pWidth}px`; player.style.height = `${pHeight}px`;
      player.style.transform = `translate(-50%, -50%) rotate(0deg)`;
      player.style.setProperty('--rot', '0deg');
      
      doodleCanvas.style.display = 'none'; 
      document.getElementById('jelly-busted').style.display = 'none';
      
      currentMapIndex++; renderMap();
    };

    // --- 3. 이동 및 뷰파인더 크기 조절 (Math.round 로 정수 픽셀 강제) ---
    let isResizing = false;
    resizeHandle.addEventListener('mousedown', (e) => { isResizing = true; e.stopPropagation(); });
    resizeHandle.addEventListener('touchstart', (e) => { isResizing = true; e.stopPropagation(); }, {passive: false});
    window.addEventListener('mouseup', () => isResizing = false);
    window.addEventListener('touchend', () => isResizing = false);

    window.addEventListener('mousemove', (e) => {
      if(!isResizing || mode !== 'move') return;
      const rect = player.getBoundingClientRect();
      pWidth = Math.round(Math.max(30, Math.min(400, e.clientX - rect.left)));
      pHeight = Math.round(Math.max(30, Math.min(400, e.clientY - rect.top)));
      player.style.width = `${pWidth}px`; player.style.height = `${pHeight}px`;
    });
    window.addEventListener('touchmove', (e) => {
      if(!isResizing || mode !== 'move') return;
      const rect = player.getBoundingClientRect();
      pWidth = Math.round(Math.max(30, Math.min(400, e.touches[0].clientX - rect.left)));
      pHeight = Math.round(Math.max(30, Math.min(400, e.touches[0].clientY - rect.top)));
      player.style.width = `${pWidth}px`; player.style.height = `${pHeight}px`;
    }, {passive: false});

    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.code === 'Space' && mode === 'move') copyBackground(); });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyCenter = {x: 50, y: 50};
    joyZone.addEventListener('touchmove', (e) => {
      if(mode !== 'move' && mode !== 'edit') return;
      e.preventDefault();
      let touchX = e.touches[0].clientX - joyZone.getBoundingClientRect().left;
      let touchY = e.touches[0].clientY - joyZone.getBoundingClientRect().top;
      let dx = touchX - joyCenter.x, dy = touchY - joyCenter.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if(dist > 30) { dx *= 30/dist; dy *= 30/dist; }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      vX = (dx/30)*speed; vY = (dy/30)*speed;
    });
    joyZone.addEventListener('touchend', () => { vX=0; vY=0; joyKnob.style.transform = `translate(0,0)`; });

    function gameLoop() {
      if (mode === 'move' || mode === 'edit') {
        if (keys['w'] || keys['arrowup']) vY = -speed; else if (keys['s'] || keys['arrowdown']) vY = speed; else if (!isMobile) vY = 0;
        if (keys['a'] || keys['arrowleft']) vX = -speed; else if (keys['d'] || keys['arrowright']) vX = speed; else if (!isMobile) vX = 0;

        // 이동 좌표도 강제 정수 처리하여 소수점 렌더링 방지
        pX = Math.round(Math.max(pWidth/2, Math.min(mapContainer.clientWidth - pWidth/2, pX + vX)));
        pY = Math.round(Math.max(pHeight/2, Math.min(mapContainer.clientHeight - pHeight/2, pY + vY)));
        player.style.left = `${pX}px`; player.style.top = `${pY}px`;
        
        if(vX !== 0 || vY !== 0) player.classList.add('walking'); else player.classList.remove('walking');
      }
      requestAnimationFrame(gameLoop);
    }
    initGame(); gameLoop();

    // --- 4. ★ 완벽한 고화질 무손실 캡처 로직 ★ ---
    window.copyBackground = () => {
      if(mode !== 'move') return;
      
      const tCanvas = document.createElement('canvas');
      
      // 소수점으로 인한 블러링을 완벽히 차단하기 위해 모든 좌표를 반올림 처리
      const sw = Math.round(pWidth * dpr);
      const sh = Math.round(pHeight * dpr);
      const sx = Math.round((pX - pWidth/2) * dpr);
      const sy = Math.round((pY - pHeight/2) * dpr);

      tCanvas.width = sw; 
      tCanvas.height = sh;
      const tCtx = tCanvas.getContext('2d');
      
      // 원본 캔버스에서 정확한 픽셀 단위로 추출
      tCtx.drawImage(bgCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
      
      player.style.backgroundImage = `url(${tCanvas.toDataURL()})`;
      player.classList.add('copied');
      
      mode = 'edit';
      document.getElementById('ui-move').style.display = 'none';
      document.getElementById('ui-edit').style.display = 'flex';
      
      // 낙서 캔버스도 화질에 맞춰 해상도 상승 적용
      doodleCanvas.style.display = 'block';
      doodleCanvas.width = sw; 
      doodleCanvas.height = sh;
      doodleCtx.scale(dpr, dpr);
    };

    // 정밀 회전 슬라이더
    rotSlider.addEventListener('input', (e) => {
      rotation = e.target.value;
      player.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
      player.style.setProperty('--rot', `${rotation}deg`);
    });

    let isDrawing = false, tool = 'pen';
    window.setTool = (t) => { tool = t; document.getElementById('btn-pen').classList.toggle('active-tool', t === 'pen'); document.getElementById('btn-eraser').classList.toggle('active-tool', t === 'eraser'); doodleCtx.globalCompositeOperation = t === 'eraser' ? 'destination-out' : 'source-over'; };
    function getMousePos(e) { const rect = doodleCanvas.getBoundingClientRect(); const cX = e.touches ? e.touches[0].clientX : e.clientX; const cY = e.touches ? e.touches[0].clientY : e.clientY; return { x: cX - rect.left, y: cY - rect.top }; }
    doodleCanvas.addEventListener('mousedown', (e) => { if(mode==='edit'){ isDrawing = true; doodleCtx.beginPath(); doodleCtx.moveTo(getMousePos(e).x, getMousePos(e).y); doodleCtx.lineWidth=3; doodleCtx.strokeStyle=document.getElementById('doodle-color').value; } });
    doodleCanvas.addEventListener('mousemove', (e) => { if(isDrawing && mode==='edit'){ doodleCtx.lineTo(getMousePos(e).x, getMousePos(e).y); doodleCtx.stroke(); } });
    window.addEventListener('mouseup', () => isDrawing = false);
    doodleCanvas.addEventListener('touchstart', (e) => { if(mode==='edit'){ isDrawing = true; doodleCtx.beginPath(); doodleCtx.moveTo(getMousePos(e).x, getMousePos(e).y); doodleCtx.lineWidth=3; doodleCtx.strokeStyle=document.getElementById('doodle-color').value; } }, {passive:false});
    doodleCanvas.addEventListener('touchmove', (e) => { if(isDrawing && mode==='edit'){ e.preventDefault(); doodleCtx.lineTo(getMousePos(e).x, getMousePos(e).y); doodleCtx.stroke(); } }, {passive:false});
    window.addEventListener('touchend', () => isDrawing = false);

    // --- 5. 술래 모드 및 Hit 판정 ---
    window.startHiding = () => {
      mode = 'seek';
      document.getElementById('ui-edit').style.display = 'none';
      document.getElementById('ui-seek').style.display = 'flex';
      if(isMobile) document.getElementById('joystick-zone').style.display = 'none';
      
      player.classList.remove('walking');
      player.classList.add('breathing');

      startTime = Date.now();
      timerInterval = setInterval(() => { document.getElementById('time').innerText = ((Date.now() - startTime)/1000).toFixed(2); }, 50);
    };

    mapContainer.addEventListener('click', (e) => {
      if(mode !== 'seek') return;
      const hitPlayer = e.target.closest('#player');

      if (hitPlayer) {
        clearInterval(timerInterval);
        player.style.display = 'none';
        
        const jelly = document.getElementById('jelly-busted');
        jelly.style.display = 'block';
        jelly.style.left = `${pX}px`; jelly.style.top = `${pY}px`;
        
        mapContainer.classList.add('shake-screen');
        showFloatingText(e.clientX, e.clientY, `🎯 ${(Date.now()-startTime)/1000}초 검거!`, '#2ecc71');
        
        mode = 'gameover'; document.getElementById('ui-gameover').style.display = 'flex';
      } else {
        life--; document.getElementById('life').innerText = life;
        mapContainer.classList.add('shake-screen');
        setTimeout(() => mapContainer.classList.remove('shake-screen'), 300);
        showFloatingText(e.clientX, e.clientY, `❌ 헛방!`, '#e74c3c');

        if(life <= 0) {
          clearInterval(timerInterval);
          showFloatingText(pX, pY, `젤리의 완승! ㅋㅋ`, '#3498db');
          mode = 'gameover'; document.getElementById('ui-gameover').style.display = 'flex';
        }
      }
    });

    function showFloatingText(x, y, text, color) {
      const ft = document.createElement('div');
      ft.className = 'floating-text'; ft.style.color = color; ft.innerText = text;
      ft.style.left = `${x-40}px`; ft.style.top = `${y-20}px`;
      document.body.appendChild(ft);
    }
  </script>
</body>
</html>
