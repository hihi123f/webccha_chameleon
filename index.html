<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chameleon.io V2</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #222; color: white; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    #ui { padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: #333; width: 100%; z-index: 10; box-sizing: border-box; }
    button, input { padding: 6px 10px; font-weight: bold; cursor: pointer; border-radius: 5px; border: none; font-size: 14px; }
    #btn-hide { background: #ff4757; color: white; padding: 8px 15px; font-size: 16px; }
    
    .active-tool { border: 2px solid #ffd32a !important; background: #555; color: white; }

    #map-container {
      position: relative;
      width: 100%;
      height: 80vh;
      background: url('https://picsum.photos/1200/800') no-repeat center/cover;
      overflow: hidden;
    }

    /* 드래그 가능한 도화지 래퍼 */
    #canvas-wrapper {
      position: absolute;
      top: 50%; left: 50%;
      width: 100px; height: 100px;
      transform: translate(-50%, -50%);
      border: 1px dashed #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 2;
    }

    /* 드래그 손잡이 (상단 바) */
    #drag-handle {
      width: 100%; height: 15px;
      background: rgba(255, 255, 255, 0.3);
      cursor: grab;
    }
    #drag-handle:active { cursor: grabbing; }

    #draw-canvas { cursor: crosshair; display: block; }

    .breathing {
      animation: breath 3s infinite ease-in-out;
      border: none !important;
      box-shadow: none !important;
    }
    .breathing #drag-handle { display: none; } /* 숨을 땐 손잡이 제거 */

    @keyframes breath {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.03); }
    }

    #jelly-body {
      position: absolute; display: none; font-size: 40px; z-index: 1;
      animation: tremble 0.1s infinite; 
    }
    @keyframes tremble { 0%, 100% { transform: translate(-2px, 1px); } 50% { transform: translate(2px, -1px); } }

    .floating-text {
      position: absolute; color: #ffd32a; font-weight: 900; font-size: 24px;
      text-shadow: 2px 2px 4px #000; pointer-events: none;
      animation: floatUp 1.5s ease-out forwards; z-index: 100;
    }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
  </style>
</head>
<body>

  <div id="ui">
    <input type="color" id="color-picker" value="#ff0000">
    
    <span style="display:flex; align-items:center; gap:5px;">
      굵기: <input type="range" id="brush-size" min="1" max="20" value="4">
    </span>

    <button id="btn-pen" class="active-tool" onclick="setTool('pen')">🖌️ 펜</button>
    <button id="btn-eraser" onclick="setTool('eraser')">🧹 지우개</button>
    <button onclick="clearCanvas()">🗑️ 전체 지우기</button>
    
    <button id="btn-hide" onclick="startHiding()">👀 숨기 완료!</button>
    <div id="timer-display" style="display:none; font-size: 1.2rem; font-weight:bold;">⏱️ <span id="time">0.00</span>초</div>
  </div>

  <div id="map-container">
    <div id="canvas-wrapper">
      <div id="drag-handle" title="여기를 잡고 이동하세요"></div>
      <canvas id="draw-canvas" width="100" height="85"></canvas>
    </div>
    <div id="jelly-body">😳</div>
  </div>

  <script>
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');
    
    let isDrawing = false;
    let mode = 'draw'; // draw | seek
    let tool = 'pen'; // pen | eraser
    let startTime, timerInterval;

    // --- 부드러운 그리기 세팅 ---
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function setTool(newTool) {
      tool = newTool;
      document.getElementById('btn-pen').classList.toggle('active-tool', tool === 'pen');
      document.getElementById('btn-eraser').classList.toggle('active-tool', tool === 'eraser');
      // 지우개 모드면 합성 모드를 'destination-out'으로 변경
      ctx.globalCompositeOperation = (tool === 'eraser') ? 'destination-out' : 'source-over';
    }

    function getMousePos(evt) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      if (mode !== 'draw') return;
      isDrawing = true;
      const pos = getMousePos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineWidth = document.getElementById('brush-size').value;
      ctx.strokeStyle = document.getElementById('color-picker').value;
    }

    function draw(e) {
      if (!isDrawing || mode !== 'draw') return;
      e.preventDefault(); // 모바일 터치 스크롤 방지
      const pos = getMousePos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    window.addEventListener('touchend', endDraw);

    window.clearCanvas = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- 도화지 드래그 이동 로직 ---
    const handle = document.getElementById('drag-handle');
    let isDragging = false, dragOffsetX, dragOffsetY;

    handle.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragOffsetX = e.clientX - wrapper.offsetLeft;
      dragOffsetY = e.clientY - wrapper.offsetTop;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging || mode !== 'draw') return;
      wrapper.style.left = `${e.clientX - dragOffsetX}px`;
      wrapper.style.top = `${e.clientY - dragOffsetY}px`;
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // --- 숨기 완료 및 검거 로직 ---
    window.startHiding = () => {
      mode = 'seek';
      document.getElementById('btn-hide').style.display = 'none';
      document.getElementById('timer-display').style.display = 'block';
      wrapper.classList.add('breathing');

      startTime = Date.now();
      timerInterval = setInterval(() => {
        document.getElementById('time').innerText = ((Date.now() - startTime) / 1000).toFixed(2);
      }, 50);
    };

    wrapper.addEventListener('click', (e) => {
      // 그리기 모드이거나, 드래그 손잡이 클릭 시엔 무시
      if (mode !== 'seek' || e.target === handle) return;
      clearInterval(timerInterval);
      
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
      wrapper.style.display = 'none';

      const jelly = document.getElementById('jelly-body');
      jelly.style.display = 'block';
      jelly.style.left = `${wrapper.offsetLeft - 20}px`;
      jelly.style.top = `${wrapper.offsetTop - 20}px`;

      const floatingText = document.createElement('div');
      floatingText.className = 'floating-text';
      floatingText.innerHTML = `🎯 ${elapsed}초 검거!<br><span style="font-size:16px; color:white">"아 굵기 조절 실패했네 ㅋㅋ"</span>`;
      floatingText.style.left = `${e.clientX - 50}px`;
      floatingText.style.top = `${e.clientY - 30}px`;
      document.body.appendChild(floatingText);
    });
  </script>
</body>
</html>
