<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>웹챠 카멜레온 (Webcha Chameleon)</title>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; }
    
    /* 가로 스와이프 가능한 툴바 */
    #ui { 
      flex-shrink: 0; padding: 8px 12px; display: flex; gap: 15px; 
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; 
      align-items: center; background: #222; border-bottom: 3px solid #444; 
      z-index: 50; box-sizing: border-box; 
      scrollbar-width: none;
    }
    #ui::-webkit-scrollbar { display: none; }
    
    .ui-group { display: flex; gap: 8px; align-items: center; white-space: nowrap; flex-shrink: 0; }
    button, input { padding: 6px 12px; font-weight: bold; border-radius: 6px; border: none; font-size: 14px; transition: 0.1s; box-sizing: border-box; }
    button { cursor: pointer; }
    button:active { transform: translateY(2px); }
    
    .btn-main { background: #3498db; color: white; }
    .btn-action { background: #e74c3c; color: white; }
    .btn-sub { background: #555; color: white; }
    .active-tool { border: 2px solid #ffd32a !important; background: #666 !important; color: #ffd32a; }

    .control-box { display: flex; align-items: center; gap: 4px; background: #333; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; }
    .rot-btn { background: #555; color: white; padding: 2px 8px; border-radius: 4px; font-size: 16px; border: none; }
    
    #taunt-input { width: 130px; padding: 5px; background: #fff; color: #111; border: 2px solid #e74c3c; }

    #scroll-wrapper { flex-grow: 1; position: relative; overflow-y: auto; overflow-x: hidden; width: 100vw; background: #fff; }
    #map-container { position: relative; width: 100%; height: 2500px; cursor: crosshair; }
    #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .player-obj { position: absolute; transform: translate(-50%, -50%); z-index: 5; box-sizing: border-box; display: flex; justify-content: center; align-items: center; background-size: 100% 100%; background-repeat: no-repeat; pointer-events: none; }
    #local-player { outline: 2px dashed #e74c3c; outline-offset: -2px; background-color: rgba(231, 76, 60, 0.1); }
    
    #resize-handle { position: absolute; right: -15px; bottom: -15px; width: 30px; height: 30px; background: #f1c40f; border: 2px solid #222; border-radius: 50%; cursor: se-resize; z-index: 25; pointer-events: auto; box-shadow: 0 0 5px rgba(0,0,0,0.5); }

    #doodle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; cursor: crosshair; z-index: 10; pointer-events: auto; }
    #crosshair { position: absolute; color: #e74c3c; font-weight: bold; font-size: 18px; pointer-events: none; }
    .obj-face { position: absolute; z-index: 20; font-size: 22px; pointer-events: none; }

    .copied { outline: none !important; background-color: transparent !important; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .copied #resize-handle, .copied #crosshair { display: none; }
    .walking { animation: waddle 0.25s infinite alternate; }
    @keyframes waddle { 0% { margin-left: -2px; } 100% { margin-left: 2px; } }

    .breathing { box-shadow: none !important; animation: breath 5s infinite ease-in-out; pointer-events: auto !important; cursor: crosshair !important; }
    @keyframes breath { 0%, 100% { transform: translate(-50%, -50%) rotate(var(--rot)); } 50% { transform: translate(-50%, calc(-50% - 1px)) rotate(var(--rot)); } }

    .jelly-busted { position: absolute; font-size: 45px; z-index: 7; transform: translate(-50%, -50%); animation: popOut 0.3s forwards, tremble 0.1s infinite 0.3s; pointer-events: none; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
    @keyframes popOut { 0% { transform: translate(-50%, -50%) scale(0); } 100% { transform: translate(-50%, -50%) scale(1); } }
    @keyframes tremble { 0%, 100% { margin-left: -3px; } 50% { margin-left: 3px; } }

    .shake-screen { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, -4px, 0); } }
    
    .floating-text { position: absolute; font-weight: 900; font-size: 24px; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: floatUp 1.5s ease-out forwards; z-index: 100; color: white; white-space: nowrap; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }

    .combo-text { position: absolute; font-weight: 900; font-size: 45px; font-style: italic; text-shadow: 3px 3px 0 #000, 0 0 15px rgba(255,0,0,0.5); pointer-events: none; z-index: 200; white-space: nowrap; animation: comboPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes comboPop { 0% { transform: translate(-50%, -50%) scale(0.5) rotate(-15deg); opacity: 1; } 20% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; } 80% { transform: translate(-50%, -80%) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(-50%, -120%) scale(0.8) rotate(0deg); opacity: 0; } }

    .taunt-floating-banner { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); background: #ff4757; color: white; padding: 16px 28px; border-radius: 50px; font-size: 22px; font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 150; pointer-events: none; border: 4px solid #fff; animation: popTaunt 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; white-space: nowrap; }
    @keyframes popTaunt { 0% { transform: translate(-50%, -50%) scale(0.4) rotate(-10deg); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); opacity: 1; } }

    #joy-base { position: fixed; width: 100px; height: 100px; background: rgba(0,0,0,0.15); border-radius: 50%; z-index: 60; display: none; pointer-events: none; transform: translate(-50%, -50%); }
    #joy-knob { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transform: translate(-50%, -50%); }
    
    #mobile-action-btn { position: fixed; bottom: 40px; right: 20px; width: 70px; height: 70px; background: #3498db; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 60; color: white; font-size: 28px; font-weight: bold; display: none; justify-content: center; align-items: center; cursor: pointer; }
    #mobile-action-btn:active { transform: scale(0.9); }

    @media (max-width: 500px) {
      button, input { padding: 4px 8px; font-size: 13px; }
      .control-box { font-size: 12px; }
      #taunt-input { width: 100px; }
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="ui-group" style="font-weight:900; color:#3498db; font-size:16px;">🦎 웹챠 카멜레온</div>

    <div id="ui-move" class="ui-group" style="display:none;">
      <span style="font-size:12px; color:#aaa;" id="overlap-warning">좌측:조이스틱 | 우측:스크롤</span>
      <button class="btn-main" id="btn-copy" onclick="window.copyBackground()">📸 스캔 (Space)</button>
    </div>
    
    <div id="ui-edit" class="ui-group" style="display:none;">
      <!-- 회전 -->
      <div class="control-box">
        🔄 
        <button class="rot-btn" onclick="window.adjustRot(-1)">-</button>
        <input type="range" id="rot-slider" min="0" max="360" value="0" style="width:50px;">
        <button class="rot-btn" onclick="window.adjustRot(1)">+</button>
      </div>
      <!-- 💡 펜 굵기 -->
      <div class="control-box">
        굵기 <input type="range" id="pen-size" min="1" max="30" value="3" style="width:50px;">
      </div>
      <!-- 💡 스포이드 및 도구 -->
      <input type="color" id="doodle-color" value="#000000" style="padding:1px; width:26px; height:26px;">
      <button id="btn-picker" class="btn-sub" onclick="window.setTool('picker')">💧스포이드</button>
      <button id="btn-pen" class="btn-sub active-tool" onclick="window.setTool('pen')">🖌️펜</button>
      <button id="btn-eraser" class="btn-sub" onclick="window.setTool('eraser')">🧹</button>
      <button class="btn-sub" onclick="window.toggleEye()">👀</button>

      <input type="text" id="taunt-input" placeholder="인성질 멘트" maxlength="20">
      <button class="btn-action" id="btn-hide" onclick="window.finishHiding()">🤫 주차 (Space)</button>
    </div>

    <div id="ui-share" class="ui-group" style="display:none;">
      <span id="room-status-text" style="color:#2ecc71; font-size:13px; font-weight:bold;"></span>
      <button class="btn-main" onclick="window.copyLink()">🔗 방 링크 복사</button>
      <!-- 💡 버튼에 id="btn-start-seek" 추가 -->
      <button class="btn-action" id="btn-start-seek" onclick="window.startPartySeek()">🔍 술래 시작</button>
    </div>

    <div id="ui-seek" class="ui-group" style="display:none; width: 100%; justify-content: space-between;">
      <span style="color:#e74c3c; font-size:18px; font-weight:bold;">❤️ <span id="life">3</span></span>
      <span style="color:#2ecc71; font-size:15px; font-weight:bold;">남은 타겟: <span id="target-count">1</span>명</span>
      <span style="background:#ff4757; color:white; padding:4px 14px; border-radius:20px; font-size:16px; font-weight:900; box-shadow:0 3px 6px rgba(0,0,0,0.4);">
        ⏱️ <span id="time">60</span>초
      </span>
    </div>

    <div id="ui-gameover" class="ui-group" style="display:none;">
      <button class="btn-main" onclick="location.href=location.pathname">🔄 새 게임 만들기</button>
    </div>
  </div>

  <div id="scroll-wrapper">
    <div id="map-container">
      <canvas id="bg-canvas"></canvas>
      
      <div id="local-player" class="player-obj">
        <div id="crosshair">+</div>
        <span id="local-face" class="obj-face"></span>
        <canvas id="doodle-canvas"></canvas>
        <div id="resize-handle"></div>
      </div>
    </div>
  </div>

  <div id="joy-base"><div id="joy-knob"></div></div>
  <div id="mobile-action-btn">📸</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYmOC4OiW90_8ee0ndpO6xSRSBKJENlws",
      authDomain: "webcchachameleon.firebaseapp.com",
      databaseURL: "https://webcchachameleon-default-rtdb.firebaseio.com", 
      projectId: "webcchachameleon",
      storageBucket: "webcchachameleon.firebasestorage.app",
      messagingSenderId: "1027865688324",
      appId: "1:1027865688324:web:66dc784418c4a479a37851"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch(e) { console.warn("Firebase 오류 -> 로컬 모드 작동", e); }

    // ==========================================
    // 🔊 자체 Web Audio API 사운드 엔진
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type, pitchMultiplier = 1) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      if (type === 'shutter') {
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.value = 1000;
        noise.connect(filter); filter.connect(gainNode);
        gainNode.gain.setValueAtTime(1, t); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        noise.start(t); noise.stop(t + 0.1);
      } 
      else if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800 * pitchMultiplier, t);
        osc.frequency.exponentialRampToValueAtTime(200 * pitchMultiplier, t + 0.1);
        gainNode.gain.setValueAtTime(1, t); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
      }
      else if (type === 'catch') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300 * pitchMultiplier, t);
        osc.frequency.exponentialRampToValueAtTime(800 * pitchMultiplier, t + 0.2);
        gainNode.gain.setValueAtTime(0.8, t); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
      }
      else if (type === 'miss') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
        gainNode.gain.setValueAtTime(0.5, t); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.start(t); osc.stop(t + 0.15);
      }
    }

    let comboCount = 0;
    let lastCatchTime = 0;

    const scrollWrapper = document.getElementById('scroll-wrapper');
    const mapContainer = document.getElementById('map-container');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const localPlayer = document.getElementById('local-player');
    const resizeHandle = document.getElementById('resize-handle');
    const rotSlider = document.getElementById('rot-slider');
    const penSizeSlider = document.getElementById('pen-size');
    const localFace = document.getElementById('local-face');
    const doodleCanvas = document.getElementById('doodle-canvas');
    const doodleCtx = doodleCanvas.getContext('2d');
    
    let mode = 'move'; 
    let pX, pY, pWidth = 100, pHeight = 60;
    let vX = 0, vY = 0, rotation = 0;
    const speed = 4;
    let keys = {};
    let life = 3, timeLeft = 60, timerInterval;
    
    let currentRoomId = null;
    let currentMapIndex = 0;
    let roomSeed = 1;
    let existingHiders = [];
    let tauntMessage = "시력 장식이냐? 젤리 승리 ㅋㅋ";

    const MAP_HEIGHT = 2500; 
    const dpr = window.devicePixelRatio || 1;
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    
    const actionBtn = document.getElementById('mobile-action-btn');
    if (isMobile) {
      actionBtn.style.display = 'flex';
      document.getElementById('btn-copy').innerText = '📸 스캔';
      document.getElementById('btn-hide').innerText = '🤫 주차';
    }

    function seededRandom() {
      let x = Math.sin(roomSeed++) * 10000;
      return x - Math.floor(x);
    }

    // ==========================================
    // 🎨 2500px "텍스트 지옥" 초고퀄리티 맵 생성기 (10종)
    // ==========================================
    const mapGenerators = [
      // 1. 네이버 블로그 스타일 (리뷰글)
      function drawBlog() {
        let w = bgCanvas.width/dpr;
        bgCtx.fillStyle = '#fff'; bgCtx.fillRect(0, 0, w, MAP_HEIGHT);
        bgCtx.fillStyle = '#03c75a'; bgCtx.fillRect(0, 0, w, 50); // 네이버 그린
        bgCtx.fillStyle = '#fff'; bgCtx.font = 'bold 20px sans-serif'; bgCtx.fillText('NAVER 블로그', 15, 33);
        
        let cy = 100;
        bgCtx.fillStyle = '#222'; bgCtx.font = 'bold 28px sans-serif'; bgCtx.fillText('웹챠 카멜레온 9인 합방 후기', 20, cy); cy += 40;
        bgCtx.beginPath(); bgCtx.arc(35, cy+10, 20, 0, Math.PI*2); bgCtx.fillStyle = '#ddd'; bgCtx.fill();
        bgCtx.fillStyle = '#555'; bgCtx.font = '14px sans-serif'; bgCtx.fillText('게임마스터 • 2026. 8. 22.', 65, cy+15); cy += 60;

        const texts = [
          "안녕하세요! 오늘은 최근 화제가 되고 있는 웹챠 카멜레온을 플레이해봤습니다.",
          "처음에는 단순한 그림 찾기인 줄 알았는데, 막상 해보니 심리전이 장난 아니네요.",
          "특히 텍스트 사이에 교묘하게 숨는 플레이어들을 보면 감탄이 나옵니다.",
          "블로그 글씨나 하이퍼링크 사이에 숨으면 진짜 눈을 부릅뜨고 찾아야 해요.",
          "아래 스크린샷을 보시면 아시겠지만, 보호색을 완벽하게 맞추는 게 핵심입니다.",
          "여러분도 친구들과 함께 9인팟을 꾸려서 꼭 한번 해보시길 강력 추천드립니다!"
        ];
        
        for(let i=0; i<30; i++) {
          bgCtx.fillStyle = '#f1f2f6'; bgCtx.fillRect(20, cy, w-40, 200); // 사진 프레임
          bgCtx.fillStyle = '#aaa'; bgCtx.font = '14px sans-serif'; bgCtx.fillText('이미지를 불러오는 중...', w/2 - 70, cy+105);
          cy += 230;
          
          for(let j=0; j<6; j++) {
            let txt = texts[j];
            // 간혹 형광펜 하이라이트 효과
            if(seededRandom() > 0.8) {
              bgCtx.fillStyle = 'rgba(152, 255, 152, 0.4)';
              bgCtx.fillRect(15, cy-15, bgCtx.measureText(txt).width + 10, 20);
            }
            bgCtx.fillStyle = '#333'; bgCtx.font = '16px sans-serif'; bgCtx.fillText(txt, 20, cy);
            cy += 35;
          }
          cy += 30;
        }
      },

      // 2. 종합 뉴스 기사 (빽빽한 텍스트)
      function drawNews() {
        let w = bgCanvas.width/dpr;
        bgCtx.fillStyle = '#fff'; bgCtx.fillRect(0, 0, w, MAP_HEIGHT);
        bgCtx.fillStyle = '#111'; bgCtx.fillRect(0, 0, w, 50);
        bgCtx.fillStyle = '#fff'; bgCtx.font = 'bold 22px serif'; bgCtx.fillText('Webcha Times', 15, 33);
        
        let cy = 100;
        bgCtx.fillStyle = '#000'; bgCtx.font = 'bold 30px serif'; bgCtx.fillText('[단독] 위장 젤리들 완벽 잠입', 20, cy); cy += 30;
        bgCtx.font = '22px serif'; bgCtx.fillText('전 세계 술래들 패닉 상태 빠져', 20, cy); cy += 40;
        bgCtx.fillStyle = '#888'; bgCtx.font = '13px sans-serif'; bgCtx.fillText('김웹챠 기자 | 입력 2026-08-22 09:00', 20, cy); cy += 30;
        bgCtx.strokeStyle = '#eee'; bgCtx.beginPath(); bgCtx.moveTo(20,cy); bgCtx.lineTo(w-20,cy); bgCtx.stroke(); cy += 30;

        const newsText = [
          "최근 출시된 웹 기반 멀티플레이 게임 '웹챠 카멜레온'이 전 세계적으로",
          "폭발적인 인기를 끌고 있다. 이 게임은 유저가 배경의 일부를 캡처해",
          "자신을 위장하는 독특한 시스템을 갖추고 있다.",
          "전문가들은 이 게임의 성공 요인으로 '인간의 착시를 이용한 고도의 심리전'을",
          "꼽았다. 특히 텍스트가 밀집된 구간에서 위장할 경우, 술래의 시선을",
          "완벽하게 회피할 수 있어 유저들 사이에서 명당으로 불리고 있다.",
          "개발진은 앞으로 더 많은 텍스트 맵과 장애물을 추가하여 난이도를",
          "높일 계획이라고 밝혔다. 한편, 일부 유저들은 너무 완벽한 위장술에",
          "불만을 토로하며 '시력 검사 게임이냐'는 우스갯소리를 남기기도 했다.",
          "이러한 반응에도 불구하고 동시 접속자 수는 연일 최고치를 경신하고 있다."
        ];

        bgCtx.fillStyle = '#222'; bgCtx.font = '17px serif';
        for(let i=0; i<60; i++) {
          newsText.forEach(txt => {
            bgCtx.fillText(txt, 20, cy);
            cy += 32; // 줄간격
          });
          cy += 20; // 문단 간격

    function renderMap() {
      bgCanvas.width = scrollWrapper.clientWidth * dpr; 
      bgCanvas.height = MAP_HEIGHT * dpr; 
      bgCtx.scale(dpr, dpr); 
      roomSeed = currentMapIndex + 100;
      mapGenerators[currentMapIndex % mapGenerators.length]();
    }
    window.addEventListener('resize', renderMap);

    let isResizing = false;
    function onResizeStart(e) {
      if (mode !== 'move') return;
      isResizing = true;
      e.stopPropagation(); e.preventDefault();
    }
    resizeHandle.addEventListener('mousedown', onResizeStart);
    resizeHandle.addEventListener('touchstart', onResizeStart, { passive: false });
    window.addEventListener('mouseup', () => { isResizing = false; });
    window.addEventListener('touchend', () => { isResizing = false; });

    function handleResizeMove(clientX, clientY) {
      if (!isResizing || mode !== 'move') return;
      const rect = mapContainer.getBoundingClientRect();
      const currentMouseX = clientX - rect.left;
      const currentMouseY = clientY - rect.top; 

      pWidth = Math.round(Math.max(40, Math.min(300, (currentMouseX - pX) * 2)));
      pHeight = Math.round(Math.max(40, Math.min(300, (currentMouseY - pY) * 2)));
      localPlayer.style.width = `${pWidth}px`; localPlayer.style.height = `${pHeight}px`;
    }
    window.addEventListener('mousemove', (e) => handleResizeMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (isResizing) { e.preventDefault(); handleResizeMove(e.touches[0].clientX, e.touches[0].clientY); }
    }, { passive: false });

    // ==========================================
    // 🎨 💡 [핵심 패치] 스포이드 & 그리기 도구
    // ==========================================
    let isDrawing = false; let drawTool = 'pen';
    
    window.setTool = (t) => {
      drawTool = t;
      document.getElementById('btn-pen').classList.toggle('active-tool', t === 'pen');
      document.getElementById('btn-eraser').classList.toggle('active-tool', t === 'eraser');
      document.getElementById('btn-picker').classList.toggle('active-tool', t === 'picker');
      
      if (t === 'eraser') {
        doodleCtx.globalCompositeOperation = 'destination-out';
        doodleCanvas.style.cursor = 'cell';
        mapContainer.style.cursor = 'crosshair';
      } else if (t === 'picker') {
        doodleCtx.globalCompositeOperation = 'source-over';
        doodleCanvas.style.cursor = 'crosshair';
        mapContainer.style.cursor = 'crosshair'; // 스포이드 활성화
      } else {
        doodleCtx.globalCompositeOperation = 'source-over';
        doodleCanvas.style.cursor = 'crosshair';
        mapContainer.style.cursor = 'crosshair';
      }
    };

    function getDoodlePos(e) {
      const mapRect = mapContainer.getBoundingClientRect();
      const cX = (e.touches ? e.touches[0].clientX : e.clientX) - mapRect.left;
      const cY = (e.touches ? e.touches[0].clientY : e.clientY) - mapRect.top;
      
      const dx = cX - pX; const dy = cY - pY;
      const rad = -rotation * (Math.PI / 180);
      const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
      const ry = dx * Math.sin(rad) + dy * Math.cos(rad);
      
      return { x: rx + (pWidth / 2), y: ry + (pHeight / 2) };
    }

    // 💡 배경에서 색상을 추출하는 함수
    function extractColor(clientX, clientY) {
      const mapRect = mapContainer.getBoundingClientRect();
      const cX = clientX - mapRect.left;
      const cY = clientY - mapRect.top;
      
      // 캔버스 범위를 넘어서면 무시
      let px = Math.max(0, Math.min(bgCanvas.width - 1, cX * dpr));
      let py = Math.max(0, Math.min(bgCanvas.height - 1, cY * dpr));
      
      const pixel = bgCtx.getImageData(px, py, 1, 1).data;
      const hex = "#" + (1 << 24 | pixel[0] << 16 | pixel[1] << 8 | pixel[2]).toString(16).slice(1);
      
      document.getElementById('doodle-color').value = hex;
      window.setTool('pen'); // 추출 후 자동으로 펜 모드 복귀
    }

    function startDraw(e) {
      if (mode !== 'edit') return;

      // 💡 스포이드 모드일 경우 그리지 않고 색상만 추출
      if (drawTool === 'picker') {
        const cX = e.touches ? e.touches[0].clientX : e.clientX;
        const cY = e.touches ? e.touches[0].clientY : e.clientY;
        extractColor(cX, cY);
        return;
      }

      isDrawing = true; const p = getDoodlePos(e);
      doodleCtx.beginPath(); doodleCtx.moveTo(p.x, p.y); 
      doodleCtx.lineWidth = penSizeSlider.value; // 슬라이더 두께 적용
      doodleCtx.lineCap = 'round'; 
      doodleCtx.strokeStyle = document.getElementById('doodle-color').value;
    }
    
    function draw(e) {
      if (!isDrawing || mode !== 'edit' || drawTool === 'picker') return;
      if (e.touches) e.preventDefault(); 
      const p = getDoodlePos(e); doodleCtx.lineTo(p.x, p.y); doodleCtx.stroke();
    }
    
    // 캐릭터 내부 터치
    doodleCanvas.addEventListener('mousedown', startDraw);
    doodleCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', () => { isDrawing = false; });
    doodleCanvas.addEventListener('touchstart', startDraw, { passive: false });
    doodleCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', () => { isDrawing = false; });

    // 💡 캐릭터 외부 (배경 맵) 터치 시 스포이드 추출 허용
    function handleBgPicker(e) {
      if (mode === 'edit' && drawTool === 'picker') {
        const cX = e.touches ? e.touches[0].clientX : e.clientX;
        const cY = e.touches ? e.touches[0].clientY : e.clientY;
        extractColor(cX, cY);
      }
    }
    mapContainer.addEventListener('mousedown', handleBgPicker);
    mapContainer.addEventListener('touchstart', handleBgPicker);

    // ==========================================
    // 🎛️ 회전 및 스캔 & 주차 시스템
    // ==========================================
    window.adjustRot = (val) => {
      let current = parseInt(rotSlider.value);
      current = (current + val) % 360;
      if(current < 0) current += 360;
      rotSlider.value = current;
      applyRotation(current);
    };

    rotSlider.addEventListener('input', (e) => applyRotation(e.target.value));

    function applyRotation(deg) {
      rotation = deg;
      localPlayer.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
      localPlayer.style.setProperty('--rot', `${rotation}deg`);
    }

    window.addEventListener('keydown', e => { 
      keys[e.key.toLowerCase()] = true; 
      if(e.code === 'Space') {
        e.preventDefault(); 
        if (mode === 'move') window.copyBackground();
        else if (mode === 'edit') window.finishHiding();
      }
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    if (isMobile) {
      actionBtn.addEventListener('touchstart', (e) => {
        e.preventDefault(); e.stopPropagation();
        if (mode === 'move') window.copyBackground();
        else if (mode === 'edit') window.finishHiding();
      });
    }

    window.copyBackground = () => {
      if (mode !== 'move') return;

      const isOverlap = existingHiders.some(h => Math.hypot(h.pX - pX, h.pY - pY) < 45);
      if (isOverlap) {
        playSound('miss'); 
        document.getElementById('overlap-warning').innerText = "⚠️ 이미 선점된 자리!";
        document.getElementById('overlap-warning').style.color = "#ff4757";
        setTimeout(() => {
          document.getElementById('overlap-warning').innerText = "좌:조이스틱 | 우:스크롤";
          document.getElementById('overlap-warning').style.color = "#aaa";
        }, 1500);
        return;
      }

      playSound('shutter');

      const tCanvas = document.createElement('canvas');
      const sw = Math.round(pWidth * dpr), sh = Math.round(pHeight * dpr);
      const sx = Math.round((pX - pWidth/2) * dpr), sy = Math.round((pY - pHeight/2) * dpr);
      tCanvas.width = sw; tCanvas.height = sh;
      tCanvas.getContext('2d').drawImage(bgCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
      
      localPlayer.style.backgroundImage = `url(${tCanvas.toDataURL()})`;
      localPlayer.style.backgroundSize = `100% 100%`;
      localPlayer.classList.add('copied');
      
      mode = 'edit';
      document.getElementById('ui-move').style.display = 'none';
      document.getElementById('ui-edit').style.display = 'flex';
      if (isMobile) { actionBtn.innerText = '🤫'; actionBtn.style.background = '#e74c3c'; }

      doodleCanvas.style.display = 'block';
      doodleCanvas.width = sw; doodleCanvas.height = sh;
      doodleCtx.scale(dpr, dpr);
    };

    window.toggleEye = () => { localFace.innerText = localFace.innerText === '👀' ? '' : '👀'; };
    
    window.finishHiding = async () => {
      if (mode !== 'edit') return;
      playSound('pop'); 

      const userTaunt = document.getElementById('taunt-input').value.trim();
      if (userTaunt) tauntMessage = userTaunt;

      const mergedCanvas = document.createElement('canvas');
      mergedCanvas.width = Math.round(pWidth * dpr);
      mergedCanvas.height = Math.round(pHeight * dpr);
      const mCtx = mergedCanvas.getContext('2d');

      const bgImg = new Image();
      bgImg.src = localPlayer.style.backgroundImage.slice(5, -2);
      bgImg.onload = async () => {
        mCtx.drawImage(bgImg, 0, 0, mergedCanvas.width, mergedCanvas.height);
        mCtx.drawImage(doodleCanvas, 0, 0); 

        const myData = {
          pX: pX, pY: pY, pWidth: pWidth, pHeight: pHeight, rotation: rotation,
          hasEye: (localFace.innerText === '👀'),
          image: mergedCanvas.toDataURL(),
          taunt: tauntMessage
        };

        await saveData(myData);
      };
    };

    async function saveData(myData) {
      // 💡 [핵심 패치] 내 브라우저에 '이 방에 숨었음' 도장 쾅!
      localStorage.setItem('hidden_' + currentRoomId, 'true');

      if (db) {
        const roomRef = ref(db, 'rooms/' + currentRoomId);
        const snap = await get(roomRef);
        let roomData = snap.val() || { mapIndex: currentMapIndex, list: [] };
        if (!roomData.list) roomData.list = [];
        roomData.list.push(myData);
        await set(roomRef, roomData);
        showShareScreen(roomData.list.length);
      } else {
        let roomData = JSON.parse(localStorage.getItem('room_' + currentRoomId)) || { mapIndex: currentMapIndex, list: [] };
        roomData.list.push(myData);
        localStorage.setItem('room_' + currentRoomId, JSON.stringify(roomData));
        showShareScreen(roomData.list.length);
      }
    }

    function showShareScreen(count) {
      mode = 'share';
      document.getElementById('ui-edit').style.display = 'none';
      document.getElementById('ui-share').style.display = 'flex';
      
      // 💡 [핵심] 방장 여부에 따라 UI 다르게 보여주기
      const isHost = localStorage.getItem('isHost_' + currentRoomId) === 'true';
      if (isHost) {
        document.getElementById('room-status-text').innerText = `현재 ${count}명 숨음! (방장: 언제든 시작 가능)`;
        document.getElementById('btn-start-seek').style.display = 'inline-block';
      } else {
        document.getElementById('room-status-text').innerText = `현재 ${count}명 숨음! (방장 대기중...)`;
        document.getElementById('btn-start-seek').style.display = 'none'; // 방장 아니면 버튼 숨김
      }

      if (isMobile) { actionBtn.style.display = 'none'; }
    }

    window.copyLink = () => {
      const shareUrl = `${location.origin}${location.pathname}?room=${currentRoomId}`;
      navigator.clipboard.writeText(shareUrl).then(() => alert("방 링크 복사 완료! (친구들에게 보내세요)"));
    };

    window.startPartySeek = () => {
      // 💡 [핵심] 방장이 누르면 파이어베이스 서버에 '게임 시작' 상태값 전송!
      if (db) {
        firebase.database().ref('rooms/' + currentRoomId + '/status').set('seek');
      }
      location.href = `${location.origin}${location.pathname}?room=${currentRoomId}&mode=seek`;
    };

    // ==========================================
    // 🕵️ 술래 모드
    // ==========================================
    async function initSeeker(id) {
      let roomData = null;
      if (db) {
        const snap = await get(ref(db, 'rooms/' + id));
        if (snap.exists()) roomData = snap.val();
      } else {
        const local = localStorage.getItem('room_' + id);
        if (local) roomData = JSON.parse(local);
      }

      if (roomData) {
        mode = 'seek';
        currentMapIndex = roomData.mapIndex;
        renderMap();
        localPlayer.style.display = 'none';

        existingHiders = roomData.list || [];
        document.getElementById('target-count').innerText = existingHiders.length;
        document.getElementById('ui-move').style.display = 'none';
        document.getElementById('ui-seek').style.display = 'flex';
        if (isMobile) { actionBtn.style.display = 'none'; }

        existingHiders.forEach((data, idx) => {
          const el = document.createElement('div');
          el.className = 'player-obj copied breathing target-obj';
          el.id = `target-${idx}`;
          el.style.width = `${data.pWidth}px`; el.style.height = `${data.pHeight}px`;
          el.style.left = `${data.pX}px`; el.style.top = `${data.pY}px`;
          el.style.transform = `translate(-50%, -50%) rotate(${data.rotation}deg)`;
          el.style.setProperty('--rot', `${data.rotation}deg`);
          el.style.backgroundImage = `url(${data.image})`;
          el.style.backgroundSize = '100% 100%';
          if(data.hasEye) {
            const eye = document.createElement('span');
            eye.className = 'obj-face'; eye.innerText = '👀'; el.appendChild(eye);
          }
          mapContainer.appendChild(el);
        });

        timeLeft = 60;
        document.getElementById('time').innerText = timeLeft;
        timerInterval = setInterval(() => {
          timeLeft--;
          document.getElementById('time').innerText = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            triggerGameOver("시간 초과! 젤리들의 승리 ⏱️");
          }
        }, 1000);
      } else {
        alert("데이터를 찾을 수 없습니다.");
        location.href = location.pathname;
      }
    }

    mapContainer.addEventListener('click', (e) => {
      if (mode !== 'seek') return;
      const hitTarget = e.target.closest('.target-obj');
      const now = Date.now();

      if (hitTarget) {
        if (now - lastCatchTime < 3000) comboCount++; 
        else comboCount = 1;
        lastCatchTime = now;

        const pitchMultiplier = 1 + (comboCount * 0.15); 
        playSound('catch', pitchMultiplier); 

        const idx = parseInt(hitTarget.id.split('-')[1]);
        const caughtData = existingHiders[idx];
        hitTarget.remove(); 
        
        const jelly = document.createElement('div');
        jelly.className = 'jelly-busted'; jelly.innerText = '😳💦';
        jelly.style.left = `${caughtData.pX}px`; jelly.style.top = `${caughtData.pY}px`;
        mapContainer.appendChild(jelly);

        mapContainer.classList.add('shake-screen');
        setTimeout(() => mapContainer.classList.remove('shake-screen'), 300);

        if (comboCount >= 2) {
          let text = "DOUBLE KILL!"; let color = "#f1c40f";
          if (comboCount === 3) { text = "TRIPLE KILL!"; color = "#e67e22"; }
          else if (comboCount >= 4) { text = "UNSTOPPABLE!!"; color = "#ff4757"; }
          showFloatingCombo(e.clientX, e.clientY, text, color);
        } else {
          showFloatingText(e.clientX, e.clientY, `🎯 검거!`, '#2ecc71');
        }

        const remaining = document.querySelectorAll('.target-obj').length;
        document.getElementById('target-count').innerText = remaining;

        if (remaining === 0) {
          clearInterval(timerInterval);
          showFloatingBanner("🎉 술래 완승! 모든 젤리를 검거했습니다!");
          mode = 'gameover';
          document.getElementById('ui-seek').style.display = 'none';
          document.getElementById('ui-gameover').style.display = 'flex';
        }
      } else {
        playSound('miss'); 
        comboCount = 0; 
        
        life--;
        document.getElementById('life').innerText = life;
        mapContainer.classList.add('shake-screen');
        setTimeout(() => mapContainer.classList.remove('shake-screen'), 300);

        if (life <= 0) {
          clearInterval(timerInterval);
          const randomTaunt = existingHiders[Math.floor(Math.random()*existingHiders.length)]?.taunt || "눈은 장식이냐 ㅋㅋ";
          triggerGameOver(randomTaunt);
        } else {
          showFloatingText(e.clientX, e.clientY, `❌ 헛방!`, '#e74c3c');
        }
      }
    });

    function triggerGameOver(taunt) {
      mode = 'gameover';
      document.getElementById('ui-seek').style.display = 'none';
      document.getElementById('ui-gameover').style.display = 'flex';
      showFloatingBanner(`"${taunt}"`);
    }

    function showFloatingBanner(text) {
      const banner = document.createElement('div');
      banner.className = 'taunt-floating-banner';
      banner.innerText = text;
      document.body.appendChild(banner); 
    }

    function showFloatingText(x, y, text, color) {
      const ft = document.createElement('div');
      ft.className = 'floating-text'; ft.style.color = color; ft.innerText = text;
      const rect = mapContainer.getBoundingClientRect();
      ft.style.left = `${x - rect.left - 40}px`; 
      ft.style.top = `${y - rect.top - 20}px`;
      mapContainer.appendChild(ft);
    }

    function showFloatingCombo(x, y, text, color) {
      const ft = document.createElement('div');
      ft.className = 'combo-text'; ft.style.color = color; ft.innerText = text;
      const rect = mapContainer.getBoundingClientRect();
      ft.style.left = `${x - rect.left}px`; 
      ft.style.top = `${y - rect.top}px`;
      mapContainer.appendChild(ft);
    }

    // ==========================================
    // 🕹️ 반반 컨트롤 
    // ==========================================
    let isJoystickActive = false;
    let joyBase = document.getElementById('joy-base');
    let joyKnob = document.getElementById('joy-knob');
    let joyStart = { x: 0, y: 0 };
    const MAX_JOY_RADIUS = 40;
    const JOY_SPEED = 1.2; 
    
    scrollWrapper.addEventListener('touchstart', (e) => {
      if(mode !== 'move' && mode !== 'edit') return;
      if(e.target.closest('#resize-handle') || e.target.closest('#mobile-action-btn') || e.target.closest('#doodle-canvas')) return;
      
      const touch = e.touches[0];
      if (touch.clientX < window.innerWidth / 2) {
        isJoystickActive = true;
        joyStart.x = touch.clientX; joyStart.y = touch.clientY;
        joyBase.style.left = `${joyStart.x}px`; joyBase.style.top = `${joyStart.y}px`;
        joyBase.style.display = 'block'; joyKnob.style.transform = `translate(-50%, -50%)`;
        vX = 0; vY = 0; e.preventDefault(); 
      }
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
      if(!isJoystickActive) return;
      e.preventDefault();
      const touch = e.touches[0];
      let dx = touch.clientX - joyStart.x; let dy = touch.clientY - joyStart.y;
      let dist = Math.hypot(dx, dy);
      if(dist > MAX_JOY_RADIUS) { dx = (dx / dist) * MAX_JOY_RADIUS; dy = (dy / dist) * MAX_JOY_RADIUS; }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      vX = (dx / MAX_JOY_RADIUS) * JOY_SPEED; vY = (dy / MAX_JOY_RADIUS) * JOY_SPEED;
    }, {passive: false});

    function endJoy() {
      if(isJoystickActive) { isJoystickActive = false; joyBase.style.display = 'none'; vX = 0; vY = 0; }
    }
    window.addEventListener('touchend', endJoy);
    window.addEventListener('touchcancel', endJoy);

    function gameLoop() {
      if (mode === 'move' || mode === 'edit') {
        if (!isJoystickActive) {
          vY = 0; vX = 0;
          if (keys['w'] || keys['arrowup']) vY = -speed; else if (keys['s'] || keys['arrowdown']) vY = speed;
          if (keys['a'] || keys['arrowleft']) vX = -speed; else if (keys['d'] || keys['arrowright']) vX = speed;
        }

        pX = Math.round(Math.max(pWidth/2, Math.min(scrollWrapper.clientWidth - pWidth/2, pX + vX)));
        pY = Math.round(Math.max(pHeight/2, Math.min(MAP_HEIGHT - pHeight/2, pY + vY)));
        localPlayer.style.left = `${pX}px`; localPlayer.style.top = `${pY}px`;
        
        if(vX !== 0 || vY !== 0) localPlayer.classList.add('walking'); else localPlayer.classList.remove('walking');

        if (vY !== 0) {
          const screenY = pY - scrollWrapper.scrollTop;
          const margin = 150; 
          if (screenY < margin) scrollWrapper.scrollTop -= Math.abs(vY);
          else if (screenY > scrollWrapper.clientHeight - margin) scrollWrapper.scrollTop += Math.abs(vY);
        }
      }
      requestAnimationFrame(gameLoop);
    }

    async function initSystem() {
      const urlParams = new URLSearchParams(window.location.search);
      currentRoomId = urlParams.get('room');
      const isSeekMode = urlParams.get('mode') === 'seek';

      if (currentRoomId) {
        if (isSeekMode) await initSeeker(currentRoomId);
        else await initJoinHider(currentRoomId);
      } else {
        currentRoomId = Math.random().toString(36).substr(2, 6);
        // 💡 [핵심] 처음에 방을 만든 사람 브라우저에 '방장' 권한 저장
        localStorage.setItem('isHost_' + currentRoomId, 'true'); 
        
        currentMapIndex = Math.floor(Math.random() * mapGenerators.length);
        existingHiders = [];
        mode = 'move'; renderMap();
        pWidth = 120; pHeight = 60;
        pX = Math.round(scrollWrapper.clientWidth / 2); pY = Math.round(scrollWrapper.clientHeight / 2); 
        document.getElementById('ui-move').style.display = 'flex';
        localPlayer.style.width = `${pWidth}px`; localPlayer.style.height = `${pHeight}px`;
        gameLoop();
      }
    }

    async function initJoinHider(id) {
      let roomData = null;
      if (db) {
        const snap = await get(ref(db, 'rooms/' + id));
        if (snap.exists()) roomData = snap.val();
      } else {
        const local = localStorage.getItem('room_' + id);
        if (local) roomData = JSON.parse(local);
      }

      if (roomData) {
        // 💡 [핵심] 서버에서 'seek(시작)' 신호가 오면 무조건 다같이 술래 모드로 강제 이동!!
        if (db) {
          firebase.database().ref('rooms/' + id + '/status').on('value', snap => {
            if (snap.val() === 'seek') {
              alert("🚨 방장이 게임을 시작했습니다! 모두 색출 작전에 투입됩니다!");
              location.href = `${location.origin}${location.pathname}?room=${id}&mode=seek`;
            }
          });
        }

        currentMapIndex = roomData.mapIndex;
        existingHiders = roomData.list || [];
        renderMap();

        // 이미 기존에 주차된 젤리들 렌더링
        existingHiders.forEach((data) => {
          const el = document.createElement('div');
          el.className = 'player-obj copied breathing';
          el.style.width = `${data.pWidth}px`; el.style.height = `${data.pHeight}px`;
          el.style.left = `${data.pX}px`; el.style.top = `${data.pY}px`;
          el.style.transform = `translate(-50%, -50%) rotate(${data.rotation}deg)`;
          el.style.setProperty('--rot', `${data.rotation}deg`);
          el.style.backgroundImage = `url(${data.image})`;
          el.style.backgroundSize = '100% 100%';
          if(data.hasEye) {
            const eye = document.createElement('span');
            eye.className = 'obj-face'; eye.innerText = '👀'; el.appendChild(eye);
          }
          mapContainer.appendChild(el);
        });

        // 💡 [핵심 패치] 이 기기에서 이미 숨은 방인지 검사
        if (localStorage.getItem('hidden_' + id)) {
          alert("이미 이 방에 위장하셨습니다! 친구들을 기다리거나 술래를 시작하세요.");
          document.getElementById('local-player').style.display = 'none'; // 내 위장 박스 숨김
          showShareScreen(existingHiders.length);
          return; // 여기서 로직 종료 (이동 불가)
        }
        
        // 💡 [추가 방어] 방이 9명으로 꽉 찼는지 검사
        if (existingHiders.length >= 9) {
          alert("방이 꽉 찼습니다! (최대 9명) 술래 모드로 자동 시작됩니다.");
          location.href = `${location.origin}${location.pathname}?room=${id}&mode=seek`;
          return;
        }

        // 안 숨었고 자리도 있다면 정상적으로 주차 시작
        mode = 'move';
        pWidth = 120; pHeight = 60;
        pX = Math.round(scrollWrapper.clientWidth / 2); pY = Math.round(scrollWrapper.clientHeight / 2);
        document.getElementById('ui-move').style.display = 'flex';
        localPlayer.style.width = `${pWidth}px`; localPlayer.style.height = `${pHeight}px`;

        gameLoop();
      } else {
        location.href = location.pathname;
      }
    }

    window.addEventListener('touchstart', initAudio, { once: true });
    window.addEventListener('click', initAudio, { once: true });

    initSystem();
  </script>
</body>
</html>
