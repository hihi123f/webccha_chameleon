<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>웹챠 카멜레온 (Webcha Chameleon)</title>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- 게임용 귀여운 폰트 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    /* 커스텀 게임 알림창 스타일 */
    #game-alert-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 10000;
      display: none; justify-content: center; align-items: center;
    }
    .game-alert-box {
      background: #2c3e50; color: #fff; padding: 20px 40px;
      border-radius: 12px; border: 4px solid #f1c40f;
      font-size: 24px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      animation: popAlert 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popAlert {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    /* 💡 위장 모양 (Shape) 클래스 */
    .shape-rect { border-radius: 0; clip-path: none; }
    .shape-circle { border-radius: 50%; }
    .shape-pill { border-radius: 50px; }
    .shape-rhombus { clip-path: polygon(15% 0, 100% 0, 85% 100%, 0% 100%); }
    body { 
      margin: 0; 
      font-family: 'Jua', sans-serif; 
      background: #111; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; 
    }
    
    /* 가로 스와이프 가능한 툴바 */
    #ui { 
      flex-shrink: 0; padding: 8px 12px; display: flex; gap: 15px; 
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; 
      align-items: center; background: #222; border-bottom: 3px solid #444; 
      z-index: 50; box-sizing: border-box; scrollbar-width: none; width: 100%;
    }
    #ui::-webkit-scrollbar { display: none; }
    
    .ui-group { display: flex; gap: 8px; align-items: center; white-space: nowrap; flex-shrink: 0; }
    button, input { 
      padding: 8px 14px; 
      font-family: 'Jua', sans-serif; 
      font-size: 15px; 
      border-radius: 8px; 
      border: none; 
      transition: 0.1s; 
      box-sizing: border-box; 
      outline: none;
    }
    button { cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
    button:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0.3); }
    
    .btn-main { background: #3498db; color: white; }
    .btn-action { background: #e74c3c; color: white; }
    .btn-sub { background: #555; color: white; }
    .active-tool { border: 2px solid #ffd32a !important; background: #666 !important; color: #ffd32a; }

    .control-box { display: flex; align-items: center; gap: 4px; background: #333; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; color: #ddd; }
    .rot-btn { background: #555; color: white; padding: 2px 8px; border-radius: 4px; font-size: 16px; border: none; }
    
    #taunt-input { width: 130px; padding: 5px; background: #fff; color: #111; border: 2px solid #e74c3c; }

    #scroll-wrapper { flex-grow: 1; position: relative; overflow-y: auto; overflow-x: auto; width: 100%; background: #fff; }
    
    #map-container { position: relative; width: 1000px; height: 5000px; cursor: crosshair; }
    #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    .player-obj { position: absolute; transform: translate(-50%, -50%); z-index: 5; box-sizing: border-box; display: flex; justify-content: center; align-items: center; background-size: 100% 100%; background-repeat: no-repeat; pointer-events: none; }
    #local-player { outline: 2px dashed #e74c3c; outline-offset: -2px; background-color: rgba(231, 76, 60, 0.1); z-index: 999 !important; }
    
    #resize-handle { position: absolute; right: -15px; bottom: -15px; width: 30px; height: 30px; background: #f1c40f; border: 2px solid #222; border-radius: 50%; cursor: se-resize; z-index: 25; pointer-events: auto; box-shadow: 0 0 5px rgba(0,0,0,0.5); }

    #doodle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; cursor: crosshair; z-index: 10; pointer-events: auto; }
    #crosshair { position: absolute; color: #e74c3c; font-weight: bold; font-size: 18px; pointer-events: none; }
    .obj-face { position: absolute; z-index: 20; font-size: 22px; pointer-events: none; }

    .copied { outline: none !important; background-color: transparent !important; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .copied #resize-handle, .copied #crosshair { display: none; }
    .walking { animation: waddle 0.25s infinite alternate; }
    @keyframes waddle { 0% { margin-left: -2px; } 100% { margin-left: 2px; } }

    /* 💡 [수정] 숨결(Breathing) 덜 티나게 변경 */
    .breathing { box-shadow: none !important; animation: breath 3s infinite ease-in-out; pointer-events: auto !important; cursor: crosshair !important; }
    @keyframes breath { 
      0%, 100% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); opacity: 1; } 
      50% { transform: translate(-50%, calc(-50% - 1px)) rotate(var(--rot)) scale(1.01); opacity: 0.95; } 
    }

    .jelly-busted { position: absolute; font-size: 45px; z-index: 7; transform: translate(-50%, -50%); animation: popOut 0.3s forwards, tremble 0.1s infinite 0.3s; pointer-events: none; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
    @keyframes popOut { 0% { transform: translate(-50%, -50%) scale(0); } 100% { transform: translate(-50%, -50%) scale(1); } }
    @keyframes tremble { 0%, 100% { margin-left: -3px; } 50% { margin-left: 3px; } }

    .shake-screen { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, -4px, 0); } }
    
    .floating-text { position: absolute; font-weight: 900; font-size: 24px; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: floatUp 1.5s ease-out forwards; z-index: 100; color: white; white-space: nowrap; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }

    .combo-text { position: absolute; font-weight: 900; font-size: 45px; font-style: italic; text-shadow: 3px 3px 0 #000, 0 0 15px rgba(255,0,0,0.5); pointer-events: none; z-index: 200; white-space: nowrap; animation: comboPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes comboPop { 0% { transform: translate(-50%, -50%) scale(0.5) rotate(-15deg); opacity: 1; } 20% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; } 80% { transform: translate(-50%, -80%) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(-50%, -120%) scale(0.8) rotate(0deg); opacity: 0; } }

    .taunt-floating-banner { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); background: #ff4757; color: white; padding: 16px 28px; border-radius: 50px; font-size: 22px; font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 150; pointer-events: none; border: 4px solid #fff; animation: popTaunt 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; white-space: nowrap; }
    @keyframes popTaunt { 0% { transform: translate(-50%, -50%) scale(0.4) rotate(-10deg); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); opacity: 1; } }

    #joy-base { position: fixed; width: 100px; height: 100px; background: rgba(0,0,0,0.15); border-radius: 50%; z-index: 60; display: none; pointer-events: none; transform: translate(-50%, -50%); }
    #joy-knob { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transform: translate(-50%, -50%); }
    
    #mobile-action-btn { position: fixed; bottom: 40px; right: 20px; width: 70px; height: 70px; background: #3498db; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 60; color: white; font-size: 28px; font-weight: bold; display: none; justify-content: center; align-items: center; cursor: pointer; }
    #mobile-action-btn:active { transform: scale(0.9); }

    @media (max-width: 500px) {
      button, input { padding: 4px 8px; font-size: 13px; }
      .control-box { font-size: 12px; }
      #taunt-input { width: 100px; }
    }
    
    /* 💡 킬로그 및 결과창 애니메이션 UI */
    #kill-log-box { position: fixed; top: 60px; right: 10px; z-index: 1000; pointer-events: none; display: flex; flex-direction: column; gap: 5px; }
    .kill-log-item { background: rgba(0,0,0,0.8); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; animation: slideInRight 0.3s ease-out, fadeOut 0.5s ease-in 2.5s forwards; border-left: 4px solid #f1c40f; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

    #leaderboard-box { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; color: white; text-align: left; max-height: 200px; overflow-y: auto; width: 100%; box-sizing: border-box; }
    .rank-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #444; font-size: 15px; font-weight: bold; }
    .rank-item:last-child { border-bottom: none; }

    /* 💡 v2.0 로비 UI 스타일 */
    #lobby-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #111 url('https://www.transparenttextures.com/patterns/stardust.png');
      z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .lobby-box {
      background: #222; padding: 30px; border-radius: 15px; border: 4px solid #3498db;
      text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .lobby-title { color: #3498db; font-size: 32px; margin: 0 0 20px 0; text-shadow: 2px 2px 0 #000; }
    #nickname-input {
      width: 100%; padding: 12px; font-size: 18px; text-align: center;
      border-radius: 8px; border: 2px solid #555; margin-bottom: 20px; background: #333; color: white;
    }
    .room-list-box {
      background: #1a1a1a; border-radius: 8px; height: 150px; overflow-y: auto;
      margin-bottom: 20px; padding: 10px; text-align: left;
    }
    .room-item {
      display: flex; justify-content: space-between; padding: 10px;
      background: #333; border-radius: 6px; margin-bottom: 8px; font-size: 15px; color: white;
    }
    .room-item button { padding: 4px 10px; font-size: 13px; background: #2ecc71; }
  </style>
</head>
<body>
  <!-- 💡 커스텀 게임 알림창 -->
  <div id="game-alert-overlay">
    <div class="game-alert-box" id="game-alert-message">알림 메시지</div>
  </div>

  <!-- 💡 v2.0 로비 화면 -->
  <div id="lobby-overlay">
    <div class="lobby-box">
      <h1 class="lobby-title">🦎 웹챠 카멜레온</h1>
      <input type="text" id="nickname-input" placeholder="사용할 닉네임 입력 (최대 6자)" maxlength="6">
      
      <div class="room-list-box" id="public-room-list">
        <div style="text-align:center; color:#777; margin-top:50px;">현재 대기 중인 방이 없습니다.</div>
      </div>

      <button class="btn-main" style="width: 100%; font-size: 18px; padding: 12px;" onclick="window.createRoom()">+ 새로운 방 만들기</button>
    </div>
  </div>

  <!-- 💡 실시간 킬로그가 뜰 상자 -->
  <div id="kill-log-box"></div> 

  <!-- 🕹️ 상단 메뉴바 시작 -->
  <div id="ui">
    <div class="ui-group" style="font-weight:900; color:#3498db; font-size:16px;">🦎 웹챠 카멜레온</div>

    <div id="ui-move" class="ui-group" style="display:none;">
      <span style="font-size:12px; color:#aaa;" id="overlap-warning">좌측:조이스틱 | 우측:스크롤</span>
      
      <input type="file" id="map-upload" accept="image/*" style="display:none;" onchange="window.loadCustomMap(event)">
      <button class="btn-sub" id="btn-upload-map" onclick="document.getElementById('map-upload').click()" style="display:none;">🖼️ 사진으로 맵 변경</button>

      <button class="btn-main" id="btn-copy" onclick="window.copyBackground()">📸 스캔 (Space)</button>
    </div>
    
    <div id="ui-edit" class="ui-group" style="display:none;">
      <div class="control-box">
        🔄 
        <button class="rot-btn" onclick="window.adjustRot(-1)">-</button>
        <input type="range" id="rot-slider" min="0" max="360" value="0" style="width:50px;">
        <button class="rot-btn" onclick="window.adjustRot(1)">+</button>
      </div>
      <div class="control-box">
        투명도 <input type="range" id="opacity-slider" min="0.2" max="1" step="0.1" value="1" style="width:40px;">
      </div>
      <div class="control-box">
        <button id="btn-shape" class="btn-sub" onclick="window.toggleShape()" style="font-size:14px;">🔲 모양</button>
      </div>
      <div class="control-box">
        <input type="color" id="doodle-color" value="#000000" style="padding:1px; width:26px; height:26px;">
        <input type="range" id="pen-size" min="1" max="30" value="3" style="width:50px;">
        <button id="btn-picker" class="btn-sub" onclick="window.setTool('picker')">💧</button>
        <button id="btn-pen" class="btn-sub" onclick="window.setTool('pen')">✏️펜</button>
        <button id="btn-brush" class="btn-sub active-tool" onclick="window.setTool('brush')">🎨물감</button>
        <button id="btn-eraser" class="btn-sub" onclick="window.setTool('eraser')">🧹</button>
        
        <button id="btn-text" class="btn-sub" onclick="window.setTool('text')">🔠글씨</button>
        <input type="text" id="text-input" placeholder="스탬프" style="width:90px; display:none; border:2px solid #3498db;">
        
        <button class="btn-sub" onclick="window.toggleEye()">👀</button>

        <input type="text" id="taunt-input" placeholder="인성질 멘트" maxlength="20" style="margin-left:5px;">
        <button class="btn-action" id="btn-hide" onclick="window.finishHiding()">🤫 주차 (Space)</button>
      </div>
    </div>

    <div id="ui-share" class="ui-group" style="display:none;">
      <span id="room-status-text" style="color:#2ecc71; font-size:13px; font-weight:bold;"></span>
      <button class="btn-sub" onclick="window.sendTroll('fart')">💨 방귀</button>
      <button class="btn-sub" onclick="window.sendTroll('laugh')">👻 도발</button>
      <button class="btn-main" onclick="window.copyLink()">🔗 방 링크 복사</button>
      <button class="btn-action" id="btn-start-seek" onclick="window.toggleReady()">✔️ 준비 (레디)</button>
    </div>

    <div id="ui-seek" class="ui-group" style="display:none; width: 100%; justify-content: space-between;">
      <span style="color:#e74c3c; font-size:16px; font-weight:bold;">❤️ <span id="life">3</span></span>
      <span style="color:#f39c12; font-size:16px; font-weight:bold;">내 점수: <span id="my-score">0</span>점</span>
      <span style="color:#2ecc71; font-size:15px; font-weight:bold;">남은 타겟: <span id="target-count">1</span>명</span>
      <span style="background:#ff4757; color:white; padding:4px 14px; border-radius:20px; font-size:16px; font-weight:900; box-shadow:0 3px 6px rgba(0,0,0,0.4);">
        ⏱️ <span id="time">180</span>초
      </span>
    </div>
  </div> 

  <!-- 💡 게임오버 팝업창 -->
  <div id="ui-gameover" style="display:none; flex-direction:column; align-items:center; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#111; padding:20px; border-radius:12px; border:3px solid #f1c40f; z-index:9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width:90%; max-width:400px; box-sizing:border-box;">
    <h2 id="result-title" style="margin:0 0 15px 0; color:#f1c40f; text-align:center; font-size:22px;">🏆 최종 결과 발표</h2>
    <div id="leaderboard-box" style="background:#222; padding:15px; border-radius:8px; margin-bottom:15px; color:white; text-align:left; max-height:40vh; overflow-y:auto; width:100%; box-sizing:border-box;"></div>
    <button id="btn-next-round" class="btn-main" style="width:100%; padding:14px; font-size:16px; font-weight:bold; border-radius:8px;"></button>
  </div>

  <div id="scroll-wrapper">
    <div id="map-container">
      <canvas id="bg-canvas"></canvas>
      <canvas id="seek-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; display: none; pointer-events: none;"></canvas>
      
      <div id="local-player" class="player-obj">
        <div id="crosshair">+</div>
        <span id="local-face" class="obj-face"></span>
        <canvas id="doodle-canvas"></canvas>
        <div id="resize-handle"></div>
      </div>
    </div>
  </div>

  <div id="joy-base"><div id="joy-knob"></div></div>
  <div id="mobile-action-btn">📸</div>

  <script>
    // 💡 기본 alert를 대체하는 커스텀 팝업 함수 (터치 시 즉시 닫기 적용!)
    let alertTimeout = null; // 타이머 겹침 방지용 변수
    
    function showGameAlert(msg, callback = null, duration = 2500) {
      const overlay = document.getElementById('game-alert-overlay');
      document.getElementById('game-alert-message').innerHTML = msg;
      overlay.style.display = 'flex';
      
      // 기존에 돌고 있던 타이머가 있다면 초기화
      if (alertTimeout) clearTimeout(alertTimeout);
      
      // 알림창을 닫고 콜백(다음 행동)을 실행하는 함수
      const closeAlert = () => {
        overlay.style.display = 'none';
        overlay.onclick = null; // 클릭 이벤트 해제
        if (callback) callback();
      };

      // 💡 [핵심] 화면을 클릭하거나 터치하면 기다리지 않고 즉시 닫힘!
      overlay.onclick = closeAlert;

      // 가만히 둬도 지정된 시간(duration) 뒤에 자동으로 닫힘
      alertTimeout = setTimeout(closeAlert, duration);
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDYmOC4OiW90_8ee0ndpO6xSRSBKJENlws",
      authDomain: "webcchachameleon.firebaseapp.com",
      databaseURL: "https://webcchachameleon-default-rtdb.firebaseio.com", 
      projectId: "webcchachameleon",
      storageBucket: "webcchachameleon.firebasestorage.app",
      messagingSenderId: "1027865688324",
      appId: "1:1027865688324:web:66dc784418c4a479a37851"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) { console.warn("Firebase 오류 -> 로컬 모드 작동", e); }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type, pitchMultiplier = 1) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      if (type === 'shutter') {
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.value = 1000;
        noise.connect(filter); filter.connect(gainNode);
        gainNode.gain.setValueAtTime(1, t); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        noise.start(t); noise.stop(t + 0.1);
      } 
      else if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800 * pitchMultiplier, t);
        osc.frequency.exponentialRampToValueAtTime(200 * pitchMultiplier, t + 0.1);
        gainNode.gain.setValueAtTime(1, t); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
      }
      else if (type === 'catch') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300 * pitchMultiplier, t);
        osc.frequency.exponentialRampToValueAtTime(800 * pitchMultiplier, t + 0.2);
        gainNode.gain.setValueAtTime(0.8, t); gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
      }
      else if (type === 'miss') {
        osc.type = 'square';

    function seekLoop() {
      if (mode !== 'seek') return;
      const now = Date.now();

      // 💡 [핵심 최적화] 캔버스 전체를 지우지 않고, 타겟의 사각형 구역만 싹 지웁니다 (프레임 렉 해결!)
      activeTargets.forEach(t => {
        const w = t.pWidth * dpr * 1.5;
        const h = t.pHeight * dpr * 1.5;
        seekCtx.clearRect((t.pX * dpr) - w, (t.pY * dpr) - h, w * 2, h * 2);
      });

      activeTargets.forEach(t => {
        if (t.caught) return;

        // 💡 미세한 숨결 애니메이션
        const breathScale = 1 + Math.sin(now / 600) * 0.005; 
        const breathY = Math.sin(now / 600) * 0.5;

        seekCtx.save();
        seekCtx.translate(t.pX * dpr, (t.pY + breathY) * dpr);
        seekCtx.rotate(t.rotation * Math.PI / 180);
        seekCtx.scale(breathScale, breathScale);
        seekCtx.globalAlpha = t.opacity || 1;

        seekCtx.beginPath();
        const hw = (t.pWidth * dpr) / 2;
        const hh = (t.pHeight * dpr) / 2;
        
        if (t.shape === 'circle') seekCtx.arc(0, 0, Math.max(hw, hh), 0, Math.PI * 2);
        else if (t.shape === 'pill') seekCtx.roundRect(-hw, -hh, hw * 2, hh * 2, Math.min(hw, hh));
        else if (t.shape === 'rhombus') {
          seekCtx.moveTo(0, -hh); seekCtx.lineTo(hw, 0);
          seekCtx.lineTo(0, hh); seekCtx.lineTo(-hw, 0);
        } else seekCtx.rect(-hw, -hh, hw * 2, hh * 2);
        seekCtx.clip();

        if (t.img && t.img.complete) seekCtx.drawImage(t.img, -hw, -hh, hw * 2, hh * 2);

        if (t.hasEye) {
          seekCtx.font = `${22 * dpr}px sans-serif`;
          seekCtx.textAlign = 'center';
          seekCtx.textBaseline = 'middle';
          seekCtx.fillText('👀', 0, 0);
        }
        seekCtx.restore();
      });

      seekLoopId = requestAnimationFrame(seekLoop);
    }

    function renderMap() {
      if (customMapBase64) {
        applyCustomMap(customMapBase64);
        return;
      }
      // 💡 일반 텍스트 맵일 경우 기본 사이즈(1000x5000)로 원상 복구
      MAP_WIDTH = 1000;
      MAP_HEIGHT = 5000;
      mapContainer.style.width = `${MAP_WIDTH}px`;
      mapContainer.style.height = `${MAP_HEIGHT}px`;

      bgCanvas.width = MAP_WIDTH * dpr; 
      bgCanvas.height = MAP_HEIGHT * dpr; 
      bgCtx.scale(dpr, dpr); 
      roomSeed = currentMapIndex + 100;
      mapGenerators[currentMapIndex % mapGenerators.length]();
    }
    window.addEventListener('resize', renderMap);

    // ==========================================
    // 💡 이미지 업로드 및 압축 로직 (커스텀 맵)
    // ==========================================
    window.loadCustomMap = (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const tempCanvas = document.createElement('canvas');
          
          // 💡 [크기 최적화] 사진 너비를 모바일에 딱 맞는 최대 800px로 제한합니다!
          // (단, 작은 사진은 억지로 1000px로 키워서 깨지는 현상을 방지함)
          const maxW = 800; 
          let scale = 1;
          if (img.width > maxW) scale = maxW / img.width;
          
          tempCanvas.width = img.width * scale;
          tempCanvas.height = img.height * scale;
          const tCtx = tempCanvas.getContext('2d');
          tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
          
          customMapBase64 = tempCanvas.toDataURL('image/jpeg', 0.7);
          
          if (db) db.ref('rooms/' + currentRoomId + '/customMap').set(customMapBase64);
          applyCustomMap(customMapBase64);
        };
      };
      reader.readAsDataURL(file);
    };

    function applyCustomMap(base64Image) {
      customMapBase64 = base64Image; 
      const img = new Image();
      img.src = base64Image;
      img.onload = () => {
        // 💡 [핵심] 억지로 1000px로 뻥튀기하지 않고, 사진의 실제 픽셀 크기에 맞춰서 게임 맵 크기를 유동적으로 셋팅!
        MAP_WIDTH = img.width;
        MAP_HEIGHT = img.height;
        
        mapContainer.style.width = `${MAP_WIDTH}px`;
        mapContainer.style.height = `${MAP_HEIGHT}px`;
        
        bgCanvas.width = MAP_WIDTH * dpr;
        bgCanvas.height = MAP_HEIGHT * dpr;
        
        const sCanvas = document.getElementById('seek-canvas');
        if (sCanvas) {
          sCanvas.width = MAP_WIDTH * dpr;
          sCanvas.height = MAP_HEIGHT * dpr;
        }
        
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.drawImage(img, 0, 0, bgCanvas.width, bgCanvas.height);
      };
    }

    let isDrawing = false; let drawTool = 'pen';
    window.setTool = (t) => {
      drawTool = t;
      
      const tools = ['pen', 'brush', 'eraser', 'picker', 'text'];
      tools.forEach(tool => {
        const btn = document.getElementById('btn-' + tool);
        if (btn) btn.classList.toggle('active-tool', t === tool);
      });
      
      const textInput = document.getElementById('text-input');
      if (textInput) textInput.style.display = (t === 'text') ? 'inline-block' : 'none';

      doodleCanvas.style.cursor = (t === 'text') ? 'text' : (t === 'eraser' ? 'cell' : 'crosshair');
      mapContainer.style.cursor = doodleCanvas.style.cursor;

      doodleCtx.shadowBlur = 0;
      doodleCtx.globalAlpha = 1.0;

      if (t === 'eraser') {
        doodleCtx.globalCompositeOperation = 'destination-out';
      } else {
        doodleCtx.globalCompositeOperation = 'source-over';
        if (t === 'brush') {
          doodleCtx.globalAlpha = 0.4;
        }
      }
    };

    opacitySlider.addEventListener('input', (e) => { localPlayer.style.opacity = e.target.value; });

    function getDoodlePos(e) {
      const mapRect = mapContainer.getBoundingClientRect();
      const cX = ((e.touches ? e.touches[0].clientX : e.clientX) - mapRect.left) / window.currentZoom;
      const cY = ((e.touches ? e.touches[0].clientY : e.clientY) - mapRect.top) / window.currentZoom;
      const dx = cX - pX; const dy = cY - pY;
      const rad = -rotation * (Math.PI / 180);
      const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
      const ry = dx * Math.sin(rad) + dy * Math.cos(rad);
      return { x: rx + (pWidth / 2), y: ry + (pHeight / 2) };
    }

    function extractColor(clientX, clientY) {
      const mapRect = mapContainer.getBoundingClientRect();
      
      // 💡 [수정됨] 화면이 확대/축소(Zoom) 된 만큼 터치 좌표도 보정해 줍니다!
      const cX = (clientX - mapRect.left) / window.currentZoom; 
      const cY = (clientY - mapRect.top) / window.currentZoom;
      
      let px = Math.max(0, Math.min(bgCanvas.width - 1, cX * dpr));
      let py = Math.max(0, Math.min(bgCanvas.height - 1, cY * dpr));
      const pixel = bgCtx.getImageData(px, py, 1, 1).data;
      const hex = "#" + (1 << 24 | pixel[0] << 16 | pixel[1] << 8 | pixel[2]).toString(16).slice(1);
      document.getElementById('doodle-color').value = hex;
      window.setTool('pen'); 
    }

    function startDraw(e) {
      if (mode !== 'edit') return;
      if (drawTool === 'picker') {
        const cX = e.touches ? e.touches[0].clientX : e.clientX;
        const cY = e.touches ? e.touches[0].clientY : e.clientY;
        extractColor(cX, cY); return;
      }
      const p = getDoodlePos(e);
      if (drawTool === 'text') {
        const txt = document.getElementById('text-input').value;
        if (!txt) return;
        const size = parseInt(document.getElementById('pen-size').value) * 3 + 10;
        doodleCtx.font = `bold ${size}px 'Jua', sans-serif`;
        doodleCtx.fillStyle = document.getElementById('doodle-color').value;
        doodleCtx.textAlign = 'center';
        doodleCtx.textBaseline = 'middle';
        doodleCtx.fillText(txt, p.x, p.y);
        return; 
      }
      
      isDrawing = true; 
      doodleCtx.beginPath(); 
      doodleCtx.moveTo(p.x, p.y); 
      doodleCtx.lineWidth = document.getElementById('pen-size').value; 
      doodleCtx.lineCap = 'round'; 
      doodleCtx.lineJoin = 'round';
      doodleCtx.strokeStyle = document.getElementById('doodle-color').value;

      if (drawTool === 'brush') {
        doodleCtx.shadowBlur = doodleCtx.lineWidth * 0.8;
        doodleCtx.shadowColor = doodleCtx.strokeStyle;
      } else {
        doodleCtx.shadowBlur = 0;
      }
    }
    
    function draw(e) {
      if (!isDrawing || mode !== 'edit' || drawTool === 'picker' || drawTool === 'text') return;
      if (e.touches) e.preventDefault(); 
      const p = getDoodlePos(e); doodleCtx.lineTo(p.x, p.y); doodleCtx.stroke();
    }
    
    doodleCanvas.addEventListener('mousedown', startDraw);
    doodleCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', () => { isDrawing = false; });
    doodleCanvas.addEventListener('touchstart', startDraw, { passive: false });
    doodleCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', () => { isDrawing = false; });

    mapContainer.addEventListener('mousedown', (e) => { if (mode === 'edit' && drawTool === 'picker') extractColor(e.clientX, e.clientY); });
    mapContainer.addEventListener('touchstart', (e) => { if (mode === 'edit' && drawTool === 'picker') extractColor(e.touches[0].clientX, e.touches[0].clientY); });

    let isResizing = false;
    function onResizeStart(e) {
      if (mode !== 'move') return;
      isResizing = true;
      e.stopPropagation(); e.preventDefault();
    }
    resizeHandle.addEventListener('mousedown', onResizeStart);
    resizeHandle.addEventListener('touchstart', onResizeStart, { passive: false });
    window.addEventListener('mouseup', () => { isResizing = false; });
    window.addEventListener('touchend', () => { isResizing = false; });

    function handleResizeMove(clientX, clientY) {
      if (!isResizing || mode !== 'move') return;
      const rect = mapContainer.getBoundingClientRect();
      const currentMouseX = (clientX - rect.left) / window.currentZoom;
      const currentMouseY = (clientY - rect.top) / window.currentZoom; 
      pWidth = Math.round(Math.max(40, Math.min(300, (currentMouseX - pX) * 2)));
      pHeight = Math.round(Math.max(40, Math.min(300, (currentMouseY - pY) * 2)));
      localPlayer.style.width = `${pWidth}px`; localPlayer.style.height = `${pHeight}px`;
    }
    window.addEventListener('mousemove', (e) => handleResizeMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => { if (isResizing) { e.preventDefault(); handleResizeMove(e.touches[0].clientX, e.touches[0].clientY); } }, { passive: false });

    window.adjustRot = (val) => {
      let current = parseInt(rotSlider.value);
      current = (current + val) % 360;
      if(current < 0) current += 360;
      rotSlider.value = current;
      applyRotation(current);
    };

    rotSlider.addEventListener('input', (e) => applyRotation(e.target.value));

    function applyRotation(deg) {
      rotation = deg;
      localPlayer.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
      localPlayer.style.setProperty('--rot', `${rotation}deg`);
    }

    window.addEventListener('keydown', e => { 
      keys[e.key.toLowerCase()] = true; 
      if(e.code === 'Space') {
        e.preventDefault(); 
        if (mode === 'move') window.copyBackground();
        else if (mode === 'edit') window.finishHiding();
      }
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    if (isMobile) {
      actionBtn.addEventListener('touchstart', (e) => {
        e.preventDefault(); e.stopPropagation();
        if (mode === 'move') window.copyBackground();
        else if (mode === 'edit') window.finishHiding();
      });
    }

    let currentBgDataUrl = ""; 

    window.copyBackground = () => {
      if (mode !== 'move') return;

      const isOverlap = existingHiders.some(h => Math.hypot(h.pX - pX, h.pY - pY) < 45);
      if (isOverlap) {
        playSound('miss'); 
        document.getElementById('overlap-warning').innerText = "⚠️ 이미 선점된 자리!";
        document.getElementById('overlap-warning').style.color = "#ff4757";
        setTimeout(() => {
          document.getElementById('overlap-warning').innerText = "좌측:조이스틱 | 우측:스크롤";
          document.getElementById('overlap-warning').style.color = "#aaa";
        }, 1500);
        return;
      }

      playSound('shutter');
      const tCanvas = document.createElement('canvas');
      const sw = Math.round(pWidth * dpr), sh = Math.round(pHeight * dpr);
      const sx = Math.round((pX - pWidth/2) * dpr), sy = Math.round((pY - pHeight/2) * dpr);
      tCanvas.width = sw; tCanvas.height = sh;
      tCanvas.getContext('2d').drawImage(bgCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
      
      currentBgDataUrl = tCanvas.toDataURL();
      localPlayer.style.backgroundImage = `url(${currentBgDataUrl})`;
      localPlayer.style.backgroundSize = `100% 100%`;
      localPlayer.classList.add('copied');
      
      mode = 'edit';
      document.getElementById('ui-move').style.display = 'none';
      document.getElementById('ui-edit').style.display = 'flex';
      if (isMobile) { actionBtn.innerText = '🤫'; actionBtn.style.background = '#e74c3c'; }

      doodleCanvas.style.display = 'block';
      doodleCanvas.width = sw; doodleCanvas.height = sh;
      doodleCtx.scale(dpr, dpr);
    };
    
    window.finishHiding = async () => {
      if (mode !== 'edit') return;
      playSound('pop'); 

      const tauntInputEl = document.getElementById('taunt-input');
      let tauntMessage = tauntInputEl ? tauntInputEl.value.trim() : "";

      const mergedCanvas = document.createElement('canvas');
      mergedCanvas.width = Math.round(pWidth * dpr);
      mergedCanvas.height = Math.round(pHeight * dpr);
      const mCtx = mergedCanvas.getContext('2d');

      const bgImg = new Image();
      bgImg.src = currentBgDataUrl; 
      bgImg.onload = async () => {
        mCtx.drawImage(bgImg, 0, 0, mergedCanvas.width, mergedCanvas.height);
        mCtx.drawImage(doodleCanvas, 0, 0); 

        const eyeCheck = localFace ? (localFace.innerText === '👀') : false;

        const myData = {
          uid: myUid, 
          pX: pX, pY: pY, pWidth: pWidth, pHeight: pHeight, rotation: rotation,
          opacity: opacitySlider.value, 
          hasEye: eyeCheck, 
          shape: currentShape,
          image: mergedCanvas.toDataURL(),
          taunt: tauntMessage
        };

        await saveData(myData);
      };
    };

    // 💡 [수정] 방 전체 데이터를 덮어씌우지 않고, 안전하게 내 위장 정보만 리스트에 '추가(push)' 합니다.
    async function saveData(myData) {
      localStorage.setItem('hidden_' + currentRoomId, 'true');

      if (db) {
        let safeList = [];
        const snap = await db.ref('rooms/' + currentRoomId + '/list').once('value');
        if (snap.exists()) {
           const data = snap.val();
           safeList = Array.isArray(data) ? data : Object.values(data);
        }
        safeList = safeList.filter(item => item !== null);
        safeList.push(myData);

        await db.ref('rooms/' + currentRoomId + '/list').set(safeList);
        showShareScreen();
      } else {
        let roomData = JSON.parse(localStorage.getItem('room_' + currentRoomId)) || { mapIndex: currentMapIndex, list: [] };
        roomData.list.push(myData);
        localStorage.setItem('room_' + currentRoomId, JSON.stringify(roomData));
        showShareScreen();
      }
    }

    let isReady = false;
    let readyCountdown = null;
    let countdownValue = 5;
    let _totalHidden = 0;
    let _readyCount = 0;

    window.toggleReady = () => {
      if (!db) {
        window.startPartySeek(); 
        return;
      }
      
      isReady = !isReady;
      const btn = document.getElementById('btn-start-seek');
      
      if (isReady) {
        btn.innerText = '❌ 준비 취소';
        btn.style.background = '#95a5a6';
        db.ref('rooms/' + currentRoomId + '/ready/' + myUid).set(true);
      } else {
        btn.innerText = '✔️ 준비 (레디)';
        btn.style.background = '#e74c3c';
        db.ref('rooms/' + currentRoomId + '/ready/' + myUid).remove();
      }
    };

    function showShareScreen(count = 0) {
      mode = 'share';
      document.getElementById('ui-edit').style.display = 'none';
      document.getElementById('ui-share').style.display = 'flex';
      if (isMobile) { actionBtn.style.display = 'none'; }

      document.getElementById('btn-start-seek').style.display = 'inline-block';

      if (db) {
        db.ref('rooms/' + currentRoomId + '/list').off('value');
        db.ref('rooms/' + currentRoomId + '/list').on('value', snap => {
          let listData = snap.val();
          if (listData) {
            _totalHidden = Array.isArray(listData) ? listData.filter(x => x).length : Object.keys(listData).length;
          } else {
            _totalHidden = 0;
          }
          updateReadyState();
        });
        
        db.ref('rooms/' + currentRoomId + '/ready').off('value');
        db.ref('rooms/' + currentRoomId + '/ready').on('value', snap => {
          let readyData = snap.val();
          _readyCount = readyData ? Object.keys(readyData).length : 0;
          updateReadyState();
        });
      } else {
        document.getElementById('room-status-text').innerText = `현재 ${count}명 숨음! (오프라인 모드)`;
      }
    }

    function updateReadyState() {
      const statusText = document.getElementById('room-status-text');
      const majority = Math.max(1, Math.floor(_totalHidden / 2) + 1);
      let baseText = `현재 ${_totalHidden}명 주차! (레디: ${_readyCount}/${majority}명)`;
      
      if (_readyCount >= majority) {
        if (!readyCountdown) {
          countdownValue = 5;
          playSound('shutter'); 
          readyCountdown = setInterval(() => {
            countdownValue--;
            if (countdownValue <= 0) {
              clearInterval(readyCountdown);
              readyCountdown = null;
              statusText.innerText = `🚨 게임 시작!`;
              window.startPartySeek(); 
            } else {
              statusText.innerText = `${baseText} ⏳ ${countdownValue}초 뒤 시작!`;
            }
          }, 1000);
        }
        if(countdownValue > 0) {
          statusText.innerText = `${baseText} ⏳ ${countdownValue}초 뒤 시작!`;
        }
        statusText.style.color = '#f1c40f'; 
      } else {
        if (readyCountdown) {
          clearInterval(readyCountdown);
          readyCountdown = null;
        }
        statusText.innerText = baseText;
        statusText.style.color = '#2ecc71'; 
      }
    }

    window.copyLink = () => {
      const shareUrl = `${location.origin}${location.pathname}?room=${currentRoomId}`;
      navigator.clipboard.writeText(shareUrl).then(() => showGameAlert("🔗 방 링크 복사 완료!<br><span style='font-size:16px; color:#f1c40f;'>친구들에게 보내세요!</span>"));
    };

    window.sendTroll = (type) => {
      if (!db) return;
      db.ref('rooms/' + currentRoomId + '/trolls').push({
        type: type, x: pX + (Math.random()*150 - 75), y: pY + (Math.random()*150 - 75)
      });
    };

    window.transitionToSeekMode = () => {
      document.getElementById('ui-move').style.display = 'none';
      document.getElementById('ui-edit').style.display = 'none';
      document.getElementById('ui-share').style.display = 'none';
      document.getElementById('local-player').style.display = 'none';
      
      initSeeker(currentRoomId);
    };

    window.startPartySeek = () => {
      if (db) {
        db.ref('rooms/' + currentRoomId + '/status').set('seek');
      } else {
        showGameAlert("🚨 게임 시작!<br>모두 색출 작전에 투입됩니다!", () => {
          window.transitionToSeekMode();
        }, 2000);
      }
    };

    // [이 함수 전체를 찾아서 아래 코드로 통째로 교체하세요!]
    async function initSeeker(id) {
      let roomData = null;
      if (db) {
        const snap = await db.ref('rooms/' + id).once('value');
        if (snap.exists()) roomData = snap.val();
      } else {
        const local = localStorage.getItem('room_' + id);
        if (local) roomData = JSON.parse(local);
      }

      if (roomData) {
        mode = 'seek';
        currentMapIndex = roomData.mapIndex;
        if (roomData.customMap) applyCustomMap(roomData.customMap);
        else renderMap();
        
        localPlayer.style.display = 'none';

        existingHiders = roomData.list || [];
        
        let validHidersCount = 0;
        Object.values(existingHiders).forEach(h => { 
          if(h && h.pX !== undefined && h.uid !== myUid) validHidersCount++; 
        });
        document.getElementById('target-count').innerText = validHidersCount;
        
        // 💡 1대1일 경우 찾자마자 즉시 끝나도록 딜레이 추가
        if (validHidersCount === 0 && Object.keys(existingHiders).length > 0) {
           setTimeout(() => triggerGameOver("🎉 모든 타겟 색출 완료!"), 1000);
        }

        document.getElementById('ui-move').style.display = 'none';
        document.getElementById('ui-seek').style.display = 'flex';
        if (isMobile) { actionBtn.style.display = 'none'; }

        // 💡 [핵심 최적화] 무거운 캔버스 렌더링 끄기 (프레임 드랍 완벽 해결)
        seekCanvas.style.display = 'none'; 
        if (seekLoopId) cancelAnimationFrame(seekLoopId); 

        activeTargets = [];
        
        // 💡 타겟들을 캔버스가 아닌, 스마트폰 그래픽카드(GPU)가 가속하는 HTML 요소로 직접 부착합니다.
        Object.entries(existingHiders).forEach(([key, data]) => {
          if (data && data.pX !== undefined) {
            activeTargets.push({ ...data, dbKey: key, caught: false });
            
            const el = document.createElement('div');
            el.className = `player-obj target-obj breathing shape-${data.shape || 'rect'}`;
            el.id = `target-${key}`;
            el.style.width = `${data.pWidth}px`;
            el.style.height = `${data.pHeight}px`;
            el.style.left = `${data.pX}px`;
            el.style.top = `${data.pY}px`;
            el.style.opacity = data.opacity || 1;
            el.style.transform = `translate(-50%, -50%) rotate(${data.rotation || 0}deg)`;
            el.style.setProperty('--rot', `${data.rotation || 0}deg`);
            el.style.backgroundImage = `url(${data.image})`;
            
            if (data.hasEye) {
              const eye = document.createElement('span');
              eye.className = 'obj-face';
              eye.innerText = '👀';
              el.appendChild(eye);
            }
            mapContainer.appendChild(el);
          }
        });

        // [이 부분을 찾아서 아래 코드로 덮어씌우세요!]
        if (db) {
          db.ref('rooms/' + id + '/killLogs').off();
          db.ref('rooms/' + id + '/caught').off();
          db.ref('rooms/' + id + '/trolls').off();
          db.ref('rooms/' + id + '/status').off(); // 💡 상태 리스너 대청소

          // 💡 [핵심 추가] 누군가 타겟을 다 찾으면 게임 강제 종료 신호 수신!
          db.ref('rooms/' + id + '/status').on('value', snap => {
            if (snap.val() === 'gameover' && mode === 'seek') {
              clearInterval(timerInterval);
              const remaining = activeTargets.filter(t => !t.caught && t.uid !== myUid).length;
              if (remaining > 0) {
                triggerGameOver("🏁 다른 사람이 1등으로 다 찾았습니다!");
              }
            }
          });

          db.ref('rooms/' + id + '/killLogs').on('child_added', snap => {
            const log = snap.val();
            const box = document.getElementById('kill-log-box');
            if (!box) return;
            const item = document.createElement('div');
            item.className = 'kill-log-item';
            item.innerText = `⚡ ${log.catcher}님이 타겟을 낚아챘습니다!`;
            box.appendChild(item);
            setTimeout(() => { if(item.parentNode) item.remove(); }, 3000);
          });

          db.ref('rooms/' + id + '/caught').on('child_added', snap => {
            const caughtDbKey = snap.key;
            const hitTarget = activeTargets.find(t => t.dbKey === caughtDbKey);
            
            if (hitTarget && !hitTarget.caught) {
              hitTarget.caught = true; 
              
              const targetEl = document.getElementById(`target-${caughtDbKey}`);
              if (targetEl) targetEl.remove();
              
              const jelly = document.createElement('div');
              jelly.className = 'jelly-busted'; jelly.innerText = '😳💦';
              jelly.style.left = `${hitTarget.pX}px`; jelly.style.top = `${hitTarget.pY}px`;
              mapContainer.appendChild(jelly);

              mapContainer.classList.add('shake-screen');
              setTimeout(() => mapContainer.classList.remove('shake-screen'), 300);

              const remaining = activeTargets.filter(t => !t.caught && t.uid !== myUid).length;
              document.getElementById('target-count').innerText = remaining;

              if (remaining === 0) {
                clearInterval(timerInterval);
                // 💡 [핵심 추가] 내가 1등으로 다 찾았으면 남들도 모두 게임 종료시킴!
                db.ref('rooms/' + id + '/status').set('gameover');
                triggerGameOver("🎉 1등으로 모든 타겟 색출 완료!");
              }
            }
          });

          db.ref('rooms/' + id + '/trolls').on('child_added', snap => {
            const troll = snap.val();
            if (troll.type === 'fart') {
              playSound('miss'); showFloatingText(troll.x, troll.y, '💨 뿌웅~', '#a55eea');
            } else if (troll.type === 'laugh') {
              playSound('shutter'); showFloatingText(troll.x, troll.y, '👻 메롱ㅋㅋ', '#ff4757');
            }
          });
        }

        timeLeft = 180; 
        document.getElementById('time').innerText = timeLeft;
        life = 3;
        document.getElementById('life').innerText = life;
        comboCount = 0;

        timerInterval = setInterval(() => {
          timeLeft--;
          document.getElementById('time').innerText = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            triggerGameOver("시간 초과! 젤리들의 승리 ⏱️");
          }
        }, 1000);
      } else {
        showGameAlert("❌ 데이터를 찾을 수 없습니다.", () => {
          isIntentional = true;
          location.href = location.pathname;
        }, 1500);
      }
    }

    // 기존 mapContainer.addEventListener('click', (e) => { ... }) 전체를 아래 코드로 통째로 교체하세요.

mapContainer.addEventListener('click', (e) => {
  if (mode !== 'seek') return;
  const now = Date.now();

  const rect = mapContainer.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) / window.currentZoom;
  const clickY = (e.clientY - rect.top) / window.currentZoom;

  let hitTargetData = null;
  let minDistToAny = Infinity;

  // 가장 위에 그려진(나중에 숨은) 녀석부터 클릭되도록 역순 탐색
  for (let i = activeTargets.length - 1; i >= 0; i--) {
    const t = activeTargets[i];
    if (t.caught) continue;

    // 힌트용 거리 계산 (가장 가까운 거리 찾기)
    const dist = Math.hypot(clickX - t.pX, clickY - t.pY);
    if (dist < minDistToAny) minDistToAny = dist;

    const dx = clickX - t.pX;
    const dy = clickY - t.pY;
    const rad = t.rotation * Math.PI / 180;
    
    const rx = dx * Math.cos(rad) + dy * Math.sin(rad);
    const ry = -dx * Math.sin(rad) + dy * Math.cos(rad);

    const hw = t.pWidth / 2;
    const hh = t.pHeight / 2;

    if (rx >= -hw && rx <= hw && ry >= -hh && ry <= hh) {
      hitTargetData = t;
      break; 
    }
  }

  // 💡 [수정] 스크롤 오차 없이 맵 내부에 정확히 텍스트를 띄우기 위한 커스텀 함수
  const showLocalText = (txt, color) => {
    const ft = document.createElement('div');
    ft.className = 'floating-text'; 
    ft.style.color = color; 
    ft.innerText = txt;
    ft.style.left = `${clickX - 40}px`; 
    ft.style.top = `${clickY - 20}px`;
    mapContainer.appendChild(ft);
  };

  if (hitTargetData) {
    // 💡 2번 문제 해결: 내 분신 클릭 시 오차 없이 정확한 위치에 띄움
    if (hitTargetData.uid === myUid) {
      showLocalText(`❌ 앗! 내 위장이다!`, '#e74c3c');
      return;
    }
    
    if (db) {
      const targetKey = hitTargetData.dbKey || hitTargetData.idx; 
      const catchRef = db.ref('rooms/' + currentRoomId + '/caught/' + targetKey);
      
      catchRef.transaction((current) => {
        if (current === null) return myUid; 
        return; 
      }, (error, committed) => {
        if (committed) {
          myScore += 100;
          document.getElementById('my-score').innerText = myScore;
          
          if (now - lastCatchTime < 3000) comboCount++; else comboCount = 1;
          lastCatchTime = now;
          
          const pitchMultiplier = 1 + (comboCount * 0.15); 
          playSound('catch', pitchMultiplier); 
          showLocalText(`🎯 내가 잡음! (+100)`, '#2ecc71');

          if (comboCount >= 2) {
            let text = "DOUBLE KILL!"; let color = "#f1c40f";
            if (comboCount === 3) { text = "TRIPLE KILL!"; color = "#e67e22"; }
            else if (comboCount >= 4) { text = "UNSTOPPABLE!!"; color = "#ff4757"; }
            showFloatingCombo(e.clientX, e.clientY, text, color);
          }

          db.ref('rooms/' + currentRoomId + '/killLogs').push({ catcher: myUid });
        } else {
          showLocalText(`앗! 남이 먼저 낚아챔`, '#e67e22');
        }
      });
    }
  } else {
    // 헛방 로직
    playSound('miss'); comboCount = 0; 
    life--; document.getElementById('life').innerText = life;
    mapContainer.classList.add('shake-screen');
    setTimeout(() => mapContainer.classList.remove('shake-screen'), 300);

    if (life <= 0) { 
      clearInterval(timerInterval); triggerGameOver("내 목숨 소진 ㅠㅠ"); 
    } else { 
      // 💡 1번 문제 해결: 기존 힌트 메시지 앞에 무조건 "❌ 헛방!" 이라는 글씨를 강제로 붙여줍니다.
      let hintMsg = "❌ 헛방!";
      let hintColor = "#e74c3c";
      if (minDistToAny !== Infinity) {
        if (minDistToAny < 120) { hintMsg = `❌ 헛방! (🔥완전 뜨거움!)`; hintColor = "#ff4757"; }
        else if (minDistToAny < 300) { hintMsg = `❌ 헛방! (♨️따뜻함)`; hintColor = "#ffa502"; }
        else { hintMsg = `❌ 헛방! (❄️아주 멉니다)`; hintColor = "#747d8c"; }
      }
      showLocalText(hintMsg, hintColor);
    }
  }
});

    async function triggerGameOver(reason) {
      mode = 'gameover';
      document.getElementById('ui-seek').style.display = 'none';

      let survived = false;
      let isHider = false;

      // 💡 [수정됨] DB 통신 중 에러가 나도 결과창은 무조건 띄우도록 철벽 방어!
      try {
        if (db) {
          const caughtSnap = await db.ref('rooms/' + currentRoomId + '/caught').once('value');
          const caughtData = caughtSnap.val() || {};
          
          if (existingHiders) {
            Object.entries(existingHiders).forEach(([key, data]) => {
              if (data && data.uid === myUid) {
                isHider = true;
                if (!caughtData[key] && !caughtData[data.idx]) {
                   survived = true; 
                }
              }
            });
          }

          if (survived) {
            myScore += 200; 
            showFloatingBanner("🎉 생존 성공! 보너스 +200점");
          } else {
            showFloatingBanner(`"${reason}"`);
          }

          await db.ref('rooms/' + currentRoomId + '/results/' + myUid).set({
            uid: myUid,
            score: myScore,
            survived: survived,
            isHider: isHider 
          });
        }
      } catch (err) {
        console.error("결과 처리 중 에러 방어 완료!", err);
      } finally {
        // 🔥 에러가 나든 안 나든 여기는 무조건 실행되어 결과창을 띄웁니다!
        document.getElementById('result-title').innerText = window.currentRound >= 3 ? "🏆 최종 순위 발표" : `🏁 라운드 ${window.currentRound} 종료!`;
        const btnNext = document.getElementById('btn-next-round');

        if (window.currentRound >= 3) {
          // 3라운드 끝: 완전 종료
          btnNext.innerText = "🔄 로비로 돌아가기";
          btnNext.style.background = "#e74c3c";
          btnNext.onclick = () => { isIntentional = true; location.href = location.pathname; };
          btnNext.style.display = 'block';
        } else {
          // 다음 라운드 대기
          if (localStorage.getItem('isHost_' + currentRoomId) === 'true') {
            btnNext.innerText = `▶️ 다음 라운드 시작 (${window.currentRound + 1}/3)`;
            btnNext.style.background = "#3498db";
            btnNext.onclick = () => startNextRound(); 
            btnNext.style.display = 'block';
          } else {
            btnNext.style.display = 'none'; 
            const waitMsg = document.createElement('div');
            waitMsg.id = 'wait-msg';
            waitMsg.style.cssText = "color:#aaa; text-align:center; margin-top:10px; font-size:14px;";
            waitMsg.innerText = "방장이 다음 라운드를 시작할 때까지 대기 중...";
            if(!document.getElementById('wait-msg')) document.getElementById('ui-gameover').appendChild(waitMsg);
          }
        }

        document.getElementById('ui-gameover').style.display = 'flex';
        renderLeaderboard();
      }
    }

    function renderLeaderboard() {
      if (!db) return;
      
      db.ref('rooms/' + currentRoomId + '/results').off('value'); // 💡 통신 찌꺼기 차단!
      db.ref('rooms/' + currentRoomId + '/results').on('value', snap => {
        const results = snap.val();
        const box = document.getElementById('leaderboard-box');
        box.innerHTML = ""; // 기존 내용 비우기

        // 💡 1. 데이터가 아예 없는 경우 방어
        if (!results) {
          box.innerHTML = "<div style='text-align:center; color:#aaa; margin-top:20px;'>점수 집계 중...</div>";
          return;
        }

        // 💡 2. DB가 배열로 주든, 객체로 주든 안전하게 배열로 통일 + 찌꺼기(null) 제거
        let list = [];
        if (Array.isArray(results)) {
            list = results.filter(x => x !== null && typeof x === 'object');
        } else {
            list = Object.values(results).filter(x => x !== null && typeof x === 'object');
        }

        // 💡 3. 점수가 비어있는 유저 때문에 에러가 나지 않도록 0점 처리 후 정렬
        list.sort((a, b) => (b.score || 0) - (a.score || 0));

        if (list.length === 0) {
          box.innerHTML = "<div style='text-align:center; color:#aaa; margin-top:20px;'>결과 데이터가 없습니다.</div>";
          return;
        }

        // 💡 4. 안전하게 순위 리스트 출력
        list.forEach((r, idx) => {
          const rankItem = document.createElement('div');
          rankItem.className = 'rank-item';
          
          let medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : '🔹'));
          let surviveTag = r.survived ? ' <span style="color:#2ecc71; font-size:12px;">[생존]</span>' : (r.isHider ? ' <span style="color:#e74c3c; font-size:12px;">[검거됨]</span>' : '');
          
          let meTag = (r.uid === myUid) ? ' <span style="color:#f1c40f;">(나)</span>' : '';

          rankItem.innerHTML = `<span>${medal} ${r.uid || '알수없음'}${meTag}${surviveTag}</span> <span style="color:#3498db;">${r.score || 0}점</span>`;
          box.appendChild(rankItem);
        });
      });
    }

    // 💡 맵 확대/축소(줌) 엔진
    window.currentZoom = window.currentZoom || 1;
    window.changeZoom = (val) => {
      window.currentZoom += val;
      if (window.currentZoom < 0.4) window.currentZoom = 0.4;
      if (window.currentZoom > 3.0) window.currentZoom = 3.0;
      
      const mc = document.getElementById('map-container');
      mc.style.transformOrigin = 'top left';
      mc.style.transform = `scale(${window.currentZoom})`;
      
      mc.style.marginBottom = `${(window.currentZoom - 1) * MAP_HEIGHT}px`;
      mc.style.marginRight = `${(window.currentZoom - 1) * MAP_WIDTH}px`;
    };

    let isJoystickActive = false; let joyBase = document.getElementById('joy-base');
    let joyKnob = document.getElementById('joy-knob'); let joyStart = { x: 0, y: 0 };
    const MAX_JOY_RADIUS = 40; const JOY_SPEED = 1.2; 
    let lastPinchDist = null; // 💡 두 손가락 거리 추적용

    scrollWrapper.addEventListener('touchstart', (e) => {
      if(mode !== 'move' && mode !== 'edit') return;
      if(e.target.closest('#resize-handle') || e.target.closest('#mobile-action-btn') || e.target.closest('#doodle-canvas')) return;
      
      // 💡 [핵심] 두 손가락이 화면에 닿으면 줌 모드 시작!
      if (e.touches.length === 2) {
        lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        return;
      }

      const touch = e.touches[0];
      if (touch.clientX < window.innerWidth / 2) {
        isJoystickActive = true;
        joyStart.x = touch.clientX; joyStart.y = touch.clientY;
        joyBase.style.left = `${joyStart.x}px`; joyBase.style.top = `${joyStart.y}px`;
        joyBase.style.display = 'block'; joyKnob.style.transform = `translate(-50%, -50%)`;
        vX = 0; vY = 0; e.preventDefault(); 
      }
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
      // 💡 [핵심] 두 손가락을 벌리거나 오므릴 때 부드럽게 줌 실행!
      if (e.touches.length === 2 && lastPinchDist !== null) {
        e.preventDefault(); 
        const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const delta = (currentDist - lastPinchDist) * 0.005; // 줌 속도 조절 (0.005)
        window.changeZoom(delta);
        lastPinchDist = currentDist;
        return;
      }

      if(!isJoystickActive) return;
      e.preventDefault();
      const touch = e.touches[0];
      let dx = touch.clientX - joyStart.x; let dy = touch.clientY - joyStart.y;
      let dist = Math.hypot(dx, dy);
      if(dist > MAX_JOY_RADIUS) { dx = (dx / dist) * MAX_JOY_RADIUS; dy = (dy / dist) * MAX_JOY_RADIUS; }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      vX = (dx / MAX_JOY_RADIUS) * JOY_SPEED; vY = (dy / MAX_JOY_RADIUS) * JOY_SPEED;
    }, {passive: false});

    function endJoy(e) {
      // 💡 손가락 하나라도 떼면 줌 모드 해제
      if (e.touches && e.touches.length < 2) {
        lastPinchDist = null;
      }

      if(isJoystickActive && (!e.touches || e.touches.length === 0)) {
        isJoystickActive = false; joyBase.style.display = 'none'; vX = 0; vY = 0;
      }
    }
    window.addEventListener('touchend', endJoy); window.addEventListener('touchcancel', endJoy);

    function gameLoop() {
      if (mode === 'move' || mode === 'edit') {
        if (!isJoystickActive) {
          vY = 0; vX = 0;
          if (keys['w'] || keys['arrowup']) vY = -speed; else if (keys['s'] || keys['arrowdown']) vY = speed;
          if (keys['a'] || keys['arrowleft']) vX = -speed; else if (keys['d'] || keys['arrowright']) vX = speed;
        }

        pX = Math.round(Math.max(pWidth/2, Math.min(MAP_WIDTH - pWidth/2, pX + vX)));
        pY = Math.round(Math.max(pHeight/2, Math.min(MAP_HEIGHT - pHeight/2, pY + vY)));
        localPlayer.style.left = `${pX}px`; localPlayer.style.top = `${pY}px`;
        
        if(vX !== 0 || vY !== 0) localPlayer.classList.add('walking'); else localPlayer.classList.remove('walking');

        if (vY !== 0) {
          const screenY = pY - scrollWrapper.scrollTop;
          const margin = 150; 
          if (screenY < margin) scrollWrapper.scrollTop -= Math.abs(vY);
          else if (screenY > scrollWrapper.clientHeight - margin) scrollWrapper.scrollTop += Math.abs(vY);
        }
      }
      requestAnimationFrame(gameLoop);
    }

    async function initSystem() {
      const urlParams = new URLSearchParams(window.location.search);
      currentRoomId = urlParams.get('room');
      const isSeekMode = urlParams.get('mode') === 'seek';

      if (currentRoomId) {
        document.getElementById('public-room-list').style.display = 'none'; 
        document.querySelector('.lobby-box button').innerText = "이 방에 입장하기";
        window.createRoom = () => {
          const nick = document.getElementById('nickname-input').value.trim();
          if (!nick) return showGameAlert("닉네임을 입력해주세요!");
          myUid = nick;
          window.currentRound = 1;
          enterMoveMode(); 
        };
        return; 
      }

      if (db) {
        db.ref('rooms').on('value', snap => {
          const rooms = snap.val() || {};
          const listBox = document.getElementById('public-room-list');
          listBox.innerHTML = "";
          let hasRoom = false;
          const now = Date.now();

          for (const [roomId, data] of Object.entries(rooms)) {
            if (!data.createdAt || (now - data.createdAt > 3600000)) {
              db.ref('rooms/' + roomId).remove(); 
              continue; 
            }

            if (data.status === 'waiting') {
              hasRoom = true;
              
              let currentPlayers = 0;
              if (data.list) {
                currentPlayers = Array.isArray(data.list) ? data.list.filter(x => x).length : Object.keys(data.list).length;
              }

              const item = document.createElement('div');
              item.className = 'room-item';
              item.innerHTML = `
                <span>🏠 ${data.hostName}님의 방 <span style="color:#f1c40f;">(${currentPlayers}/9)</span></span>
                <button onclick="window.joinRoom('${roomId}')">입장</button>
              `;
              listBox.appendChild(item);
            }
          }
          if (!hasRoom) listBox.innerHTML = '<div style="text-align:center; color:#777; margin-top:50px;">현재 대기 중인 방이 없습니다.</div>';
        });
      }
    }

    window.currentRound = window.currentRound || 1;

    window.createRoom = () => {
      const nick = document.getElementById('nickname-input').value.trim();
      if (!nick) return showGameAlert("닉네임을 입력해주세요!");
      myUid = nick;

      currentRoomId = Math.random().toString(36).substr(2, 6);
      localStorage.setItem('isHost_' + currentRoomId, 'true'); 
      currentMapIndex = Math.floor(Math.random() * mapGenerators.length);
      window.currentRound = 1; 
      
      if (db) {
        const roomRef = db.ref('rooms/' + currentRoomId);
        roomRef.set({
          hostName: myUid,
          status: 'waiting',
          mapIndex: currentMapIndex,
          round: 1,
          createdAt: Date.now() 
        });
        
        roomRef.onDisconnect().remove();
      }

      enterMoveMode();
    };

    window.joinRoom = (roomId) => {
      const nick = document.getElementById('nickname-input').value.trim();
      if (!nick) return showGameAlert("닉네임을 입력해주세요!");
      myUid = nick;
      
      currentRoomId = roomId;
      
      if (db) {
        db.ref('rooms/' + roomId).once('value').then(snap => {
          const data = snap.val();
          window.currentRound = data ? (data.round || 1) : 1;
          enterMoveMode();
        });
      } else {
        window.currentRound = 1;
        enterMoveMode();
      }
    };

    // 💡 공통: 닉네임 설정 후 움직임 모드로 진입
// 💡 공통: 닉네임 설정 후 움직임 모드로 진입
function enterMoveMode() {
  if (typeof listenForRoundChange === 'function') listenForRoundChange();

  document.getElementById('lobby-overlay').style.display = 'none';
  existingHiders = [];
  mode = 'move'; 

  // 💡 [완벽 초기화 추가] 무조건 내 캐릭터의 상태, 스캔된 이미지, 그림을 싹 지웁니다!
  const lp = document.getElementById('local-player');
  lp.style.display = 'flex';
  lp.classList.remove('copied', 'shape-circle', 'shape-pill', 'shape-rhombus', 'shape-rect');
  lp.style.backgroundImage = 'none';
  lp.style.opacity = 1;
  lp.style.transform = 'translate(-50%, -50%) rotate(0deg)'; 
  lp.style.setProperty('--rot', '0deg');
  
  const doodleCanvas = document.getElementById('doodle-canvas');
  const doodleCtx = doodleCanvas.getContext('2d');
  doodleCanvas.style.display = 'none';
  doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
  currentBgDataUrl = "";
  currentShape = 'rect';
  rotation = 0;
  if (document.getElementById('rot-slider')) document.getElementById('rot-slider').value = 0;
  if (document.getElementById('opacity-slider')) document.getElementById('opacity-slider').value = 1;

  // 💡 맵 위에 남은 이전 라운드 찌꺼기 타겟들도 확실하게 청소
  const targets = document.querySelectorAll('.target-obj, .jelly-busted, .floating-text, .combo-text');
  targets.forEach(el => el.remove());

  renderMap();
  
  pWidth = 120; pHeight = 60;
  pX = Math.round(scrollWrapper.clientWidth / 2); 
  pY = Math.round(scrollWrapper.clientHeight / 2); 
  
  document.getElementById('ui-move').style.display = 'flex';
  lp.style.width = `${pWidth}px`; 
  lp.style.height = `${pHeight}px`;
  
  if (localStorage.getItem('isHost_' + currentRoomId) === 'true') {
    document.getElementById('btn-upload-map').style.display = 'inline-block';
  }

  if (isMobile) {
    const mBtn = document.getElementById('mobile-action-btn');
    mBtn.style.display = 'flex';
    mBtn.innerText = '📸';
    mBtn.style.background = '#3498db';
  }

  if (db && myUid) {
    const myPlayerRef = db.ref('rooms/' + currentRoomId + '/players/' + myUid);
    myPlayerRef.set(true);
    myPlayerRef.onDisconnect().remove(); 
  }

  if (localStorage.getItem('isHost_' + currentRoomId) !== 'true') {
     initJoinHider(currentRoomId); 
  } else {
     if (db) {
       db.ref('rooms/' + currentRoomId + '/status').off('value');
       db.ref('rooms/' + currentRoomId + '/status').on('value', snap => {
         if (snap.val() === 'seek' && mode !== 'seek') { 
           showGameAlert("🚨 게임 시작!<br>모두 색출 작전에 투입됩니다!", () => {
             window.transitionToSeekMode(); 
           }, 2000); 
         }
       });
     }
     gameLoop(); 
  }
}

    function startNextRound() {
      if (!db) return;
      const nextMapIndex = Math.floor(Math.random() * mapGenerators.length);
      const nextRoundNum = window.currentRound + 1;
      const updates = {
        'status': 'waiting',
        'mapIndex': nextMapIndex,
        'round': nextRoundNum,
        'list': null,    
        'caught': null,  
        'ready': null,   
        'killLogs': null 
      };
      db.ref('rooms/' + currentRoomId).update(updates);
    }

    function listenForRoundChange() {
      if (!db || !currentRoomId) return;
      db.ref('rooms/' + currentRoomId + '/round').off('value');
      db.ref('rooms/' + currentRoomId + '/round').on('value', snap => {
        const r = snap.val();
        if (r && r > window.currentRound) {
          window.currentRound = r; 
          mode = 'move';
          isReady = false;
          
          const btnSeek = document.getElementById('btn-start-seek');
          if(btnSeek) {
            btnSeek.innerText = '✔️ 준비 (레디)';
            btnSeek.style.background = '#e74c3c';
          }
          
          document.getElementById('ui-gameover').style.display = 'none';
          if(document.getElementById('wait-msg')) document.getElementById('wait-msg').remove();
          
          const targets = document.querySelectorAll('.target-obj, .jelly-busted, .floating-text, .combo-text');
          targets.forEach(el => el.remove());
          
          localStorage.removeItem('hidden_' + currentRoomId);
          
          // 💡 [핵심 수정] 내 위장 풀고 흔적(이미지, 그림, 회전, 투명도, 모양) 완벽하게 싹 지우기!
          const lp = document.getElementById('local-player');
          lp.style.display = 'flex';
          lp.classList.remove('copied', 'shape-circle', 'shape-pill', 'shape-rhombus', 'shape-rect');
          lp.style.backgroundImage = 'none';
          lp.style.opacity = 1;
          lp.style.transform = 'translate(-50%, -50%) rotate(0deg)'; 
          lp.style.setProperty('--rot', '0deg');
          
          // 도화지 및 각종 변수 초기화
          doodleCanvas.style.display = 'none';
          doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
          currentBgDataUrl = "";
          currentShape = 'rect';
          rotation = 0;
          
          // UI 슬라이더 및 텍스트 박스 초기화
          document.getElementById('rot-slider').value = 0;
          document.getElementById('opacity-slider').value = 1;
          const tauntInput = document.getElementById('taunt-input');
          if(tauntInput) tauntInput.value = "";
          
          db.ref('rooms/' + currentRoomId + '/mapIndex').once('value').then(msnap => {
            currentMapIndex = msnap.val() || 0;
            enterMoveMode(); 
            showGameAlert(`🚀 라운드 ${window.currentRound} 시작!<br><span style='font-size:16px; color:#ddd;'>새로운 맵에서 위장하세요!</span>`);
          });
        }
      });
    }

    async function initJoinHider(id) {
      let roomData = null;
      if (db) {
        const snap = await db.ref('rooms/' + id).once('value');
        if (snap.exists()) roomData = snap.val();
      } else {
        const local = localStorage.getItem('room_' + id);
        if (local) roomData = JSON.parse(local);
      }

      if (roomData) {
        if (db) {
          db.ref('rooms/' + id + '/status').off('value');
          db.ref('rooms/' + id + '/status').on('value', snap => {
            if (snap.val() === 'seek' && mode !== 'seek') { 
              showGameAlert("🚨 게임 시작!<br>모두 색출 작전에 투입됩니다!", () => {
                window.transitionToSeekMode(); 
              }, 2000); 
            }
          });
        }

        currentMapIndex = roomData.mapIndex;
        existingHiders = roomData.list || [];
        
        if (localStorage.getItem('isHost_' + id) === 'true') {
          document.getElementById('btn-upload-map').style.display = 'inline-block';
        }

        if (roomData.customMap) applyCustomMap(roomData.customMap);
        else renderMap();

        if (db) {
          db.ref('rooms/' + id + '/customMap').on('value', snap => {
            if (snap.exists()) applyCustomMap(snap.val());
          });
        }

        if (localStorage.getItem('hidden_' + id)) {
          showGameAlert("👀 이미 위장 완료!<br><span style='font-size:16px; color:#ddd;'>친구들을 기다리거나 술래 모드를 시작하세요.</span>");
          document.getElementById('local-player').style.display = 'none'; 
          showShareScreen(Object.keys(existingHiders).length);
          return; 
        }
        
        if (Object.keys(existingHiders).length >= 9) {
          if (db) db.ref('rooms/' + id + '/status').set('seek');
          return;
        }

        mode = 'move';
        pWidth = 120; pHeight = 60;
        pX = Math.round(scrollWrapper.clientWidth / 2); pY = Math.round(scrollWrapper.clientHeight / 2);
        document.getElementById('ui-move').style.display = 'flex';
        localPlayer.style.width = `${pWidth}px`; localPlayer.style.height = `${pHeight}px`;

        gameLoop();
      } else {
        showGameAlert("❌ 데이터를 찾을 수 없습니다.", () => {
          isIntentional = true;
          location.href = location.pathname;
        }, 1500);
      }
    }

    window.addEventListener('touchstart', initAudio, { once: true });
    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('contextmenu', e => e.preventDefault());

    initSystem();
  </script>
